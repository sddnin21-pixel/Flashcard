<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Windows 11 — Web Simulator</title>
<style>
/* ============================================================
   RESET & BIẾN TOÀN CỤC
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#0078d4;
  --glass:rgba(243,243,243,.82);
  --solid:#f3f3f3;
  --win:#f9f9f9;
  --win2:#efefef;
  --text:#1b1b1b;
  --dim:#616161;
  --line:rgba(0,0,0,.09);
  --hover:rgba(0,0,0,.055);
  --active:rgba(0,0,0,.09);
  --shadow:0 12px 40px rgba(0,0,0,.28),0 2px 8px rgba(0,0,0,.14);
  --radius:8px;
}
body.dark{
  --glass:rgba(32,32,32,.82);
  --solid:#202020;
  --win:#202020;
  --win2:#2b2b2b;
  --text:#f2f2f2;
  --dim:#a8a8a8;
  --line:rgba(255,255,255,.09);
  --hover:rgba(255,255,255,.06);
  --active:rgba(255,255,255,.1);
  --shadow:0 12px 40px rgba(0,0,0,.65),0 2px 8px rgba(0,0,0,.4);
}
html,body{
  height:100%;width:100%;overflow:hidden;
  font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:14px;color:var(--text);background:#000;
  user-select:none;-webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit;user-select:text}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(128,128,128,.45);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,128,.75);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ============================================================
   MÀN HÌNH KHỞI ĐỘNG
   ============================================================ */
#boot{
  position:fixed;inset:0;background:#000;z-index:100000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:50px;
  transition:opacity .7s ease;
}
#boot.hide{opacity:0;pointer-events:none}
.boot-logo{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;width:92px;height:92px}
.boot-logo i{background:#4cc2ff;border-radius:4px;animation:logoIn .9s cubic-bezier(.2,.8,.3,1) both}
.boot-logo i:nth-child(1){animation-delay:.05s}
.boot-logo i:nth-child(2){animation-delay:.15s}
.boot-logo i:nth-child(3){animation-delay:.25s}
.boot-logo i:nth-child(4){animation-delay:.35s}
@keyframes logoIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.boot-spinner{
  width:34px;height:34px;border-radius:50%;
  border:3px solid rgba(255,255,255,.14);border-top-color:#fff;
  animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.boot-text{position:absolute;bottom:70px;color:#8a8a8a;font-size:13px;letter-spacing:.5px}

/* ============================================================
   MÀN HÌNH KHÓA / ĐĂNG NHẬP
   ============================================================ */
#lock{
  position:fixed;inset:0;z-index:90000;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  background-size:cover;background-position:center;
  transition:transform .6s cubic-bezier(.4,0,.2,1),opacity .6s;
}
#lock.hide{transform:translateY(-100%);opacity:0;pointer-events:none}
.lock-time{font-size:110px;font-weight:200;line-height:1;letter-spacing:-3px;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.lock-date{font-size:26px;font-weight:300;margin-top:10px;opacity:.95;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.lock-hint{position:absolute;bottom:60px;font-size:14px;opacity:.85;animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.lock-login{display:flex;flex-direction:column;align-items:center;gap:16px;animation:winIn .35s ease-out}
.lock-avatar{
  width:110px;height:110px;border-radius:50%;
  background:linear-gradient(135deg,#4cc2ff,#0078d4);
  display:grid;place-items:center;font-size:52px;
  box-shadow:0 8px 40px rgba(0,0,0,.5);
}
.lock-name{font-size:24px;font-weight:400}
.lock-btn{
  padding:10px 44px;border-radius:4px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(10px);
  font-size:14px;transition:.15s;
}
.lock-btn:hover{background:rgba(255,255,255,.28)}

/* ============================================================
   DESKTOP
   ============================================================ */
#desktop{
  position:fixed;inset:0 0 48px 0;overflow:hidden;
  background-size:cover;background-position:center;
  transition:background-image .45s ease;
}
#desktop-icons{
  position:absolute;inset:8px;
  display:grid;grid-auto-flow:column;
  grid-template-rows:repeat(auto-fill,96px);
  grid-auto-columns:90px;gap:2px;
  align-content:start;justify-content:start;
}
.dicon{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  border-radius:6px;padding:6px 4px;border:1px solid transparent;
  cursor:default;text-align:center;transition:background .1s;
}
.dicon .em{font-size:34px;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.45))}
.dicon .lb{
  font-size:11.5px;color:#fff;line-height:1.25;
  text-shadow:0 1px 4px rgba(0,0,0,.9);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  word-break:break-word;
}
.dicon:hover{background:rgba(255,255,255,.13)}
.dicon.sel{background:rgba(0,120,212,.45);border-color:rgba(140,205,255,.65)}

/* ============================================================
   CỬA SỔ
   ============================================================ */
#windows-layer{position:absolute;inset:0;pointer-events:none}
.window{
  position:absolute;pointer-events:auto;
  display:flex;flex-direction:column;
  background:var(--win);border:1px solid var(--line);border-radius:8px;
  box-shadow:var(--shadow);overflow:hidden;
  min-width:300px;min-height:170px;
  animation:winIn .16s ease-out;
}
@keyframes winIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.window.min{display:none}
.window.max{border-radius:0}
.window.focused{box-shadow:0 22px 64px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.05)}
.titlebar{
  height:38px;flex:0 0 38px;display:flex;align-items:center;gap:9px;
  padding-left:13px;cursor:default;background:var(--win);
}
.tb-icon{font-size:15px;line-height:1}
.tb-title{flex:1;font-size:12.5px;font-weight:600;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-controls{display:flex;height:100%}
.tb-controls button{
  width:46px;height:100%;display:grid;place-items:center;
  transition:background .12s;color:var(--text);
}
.tb-controls button:hover{background:var(--hover)}
.tb-controls .close:hover{background:#e81123;color:#fff}
.win-body{flex:1;overflow:auto;position:relative;background:var(--win)}
.rz{position:absolute;z-index:6}
.rz-n{top:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-s{bottom:-3px;left:10px;right:10px;height:6px;cursor:ns-resize}
.rz-w{left:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-e{right:-3px;top:10px;bottom:10px;width:6px;cursor:ew-resize}
.rz-nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nwse-resize}
.rz-ne{top:-3px;right:-3px;width:13px;height:13px;cursor:nesw-resize}
.rz-sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:nesw-resize}
.rz-se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:nwse-resize}

#snap-preview{
  position:fixed;z-index:9998;border:2px solid var(--accent);
  background:rgba(0,120,212,.22);border-radius:8px;
  pointer-events:none;opacity:0;transition:all .13s ease;
}
#snap-preview.on{opacity:1}

/* ============================================================
   TASKBAR
   ============================================================ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:48px;z-index:10000;
  display:flex;align-items:center;
  background:var(--glass);
  backdrop-filter:blur(34px) saturate(1.6);
  -webkit-backdrop-filter:blur(34px) saturate(1.6);
  border-top:1px solid var(--line);
}
.tb-center{
  position:absolute;left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:5px;
}
.tb-right{
  position:absolute;right:0;height:100%;
  display:flex;align-items:center;gap:2px;padding-right:6px;
}
.tbtn{
  position:relative;width:42px;height:40px;border-radius:6px;
  display:grid;place-items:center;font-size:20px;
  transition:background .12s;
}
.tbtn:hover{background:var(--hover)}
.tbtn:active{transform:scale(.94)}
.tbtn.run::after{
  content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:16px;height:3px;border-radius:2px;background:var(--accent);
  transition:width .2s;
}
.tbtn.act::after{width:24px}
.tray{
  display:flex;align-items:center;gap:10px;height:36px;
  padding:0 10px;border-radius:6px;font-size:13px;transition:background .12s;
}
.tray:hover{background:var(--hover)}
.tray .col{display:flex;flex-direction:column;align-items:flex-end;line-height:1.25;font-size:12px}
.tray-icons{display:flex;gap:7px;font-size:14px;opacity:.9}
#bell{width:34px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:15px}
#bell:hover{background:var(--hover)}

/* ============================================================
   START MENU
   ============================================================ */
#start{
  position:fixed;left:50%;bottom:56px;z-index:9997;
  width:640px;height:680px;max-height:calc(100vh - 80px);
  transform:translateX(-50%) translateY(24px) scale(.98);
  background:var(--glass);
  backdrop-filter:blur(44px) saturate(1.7);
  -webkit-backdrop-filter:blur(44px) saturate(1.7);
  border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow);
  opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s cubic-bezier(.2,.9,.3,1);
  display:flex;flex-direction:column;overflow:hidden;
}
#start.open{opacity:1;transform:translateX(-50%) translateY(0) scale(1);pointer-events:auto}
.start-search{
  margin:22px 22px 8px;height:38px;flex:0 0 38px;
  display:flex;align-items:center;gap:9px;padding:0 14px;
  background:var(--win);border:1px solid var(--line);border-radius:20px;
}
.start-search input{flex:1;background:none;border:none;outline:none;font-size:13.5px}
.start-scroll{flex:1;overflow-y:auto;padding:6px 22px 0}
.start-sec{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 10px}
.start-sec h3{font-size:13px;font-weight:600}
.start-sec button{font-size:12px;padding:5px 12px;border-radius:4px;background:var(--hover)}
.pin-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.pin{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 4px 10px;border-radius:6px;transition:background .12s;text-align:center;
}
.pin:hover{background:var(--hover)}
.pin .em{font-size:30px;line-height:1}
.pin .lb{font-size:11.5px;line-height:1.2;opacity:.92;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec-list{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.rec{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:6px;transition:background .12s;text-align:left;
}
.rec:hover{background:var(--hover)}
.rec .em{font-size:24px}
.rec .tx{display:flex;flex-direction:column;line-height:1.3;overflow:hidden}
.rec .tx b{font-size:12.5px;font-weight:600}
.rec .tx span{font-size:11px;color:var(--dim)}
.start-foot{
  flex:0 0 56px;margin-top:8px;padding:0 40px;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(128,128,128,.09);border-top:1px solid var(--line);
}
.start-user{display:flex;align-items:center;gap:11px;font-size:13px;font-weight:500;padding:6px 10px;border-radius:6px}
.start-user:hover{background:var(--hover)}
.start-user .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#4cc2ff,#0078d4);display:grid;place-items:center;font-size:15px}
#powerBtn{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font-size:16px}
#powerBtn:hover{background:var(--hover)}

/* ============================================================
   BẢNG NỔI (Quick settings / Lịch / Task view / Thông báo)
   ============================================================ */
.panel{
  position:fixed;z-index:9996;
  background:var(--glass);
  backdrop-filter:blur(44px) saturate(1.7);
  -webkit-backdrop-filter:blur(44px) saturate(1.7);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:translateY(16px) scale(.98);
  transition:opacity .18s,transform .18s cubic-bezier(.2,.9,.3,1);
}
.panel.open{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
#quick{right:12px;bottom:56px;width:340px;padding:18px}
.qs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qs{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:14px 6px;border-radius:8px;background:var(--hover);font-size:11px;
  transition:.15s;border:1px solid transparent;
}
.qs:hover{background:var(--active)}
.qs .ic{font-size:18px}
.qs.on{background:var(--accent);color:#fff;border-color:transparent}
.qs.on .ic{filter:brightness(1.2)}
.qs-slider{margin-top:16px}
.qs-slider label{display:flex;align-items:center;gap:10px;font-size:12px;margin-bottom:12px}
.qs-slider input[type=range]{flex:1;accent-color:var(--accent);height:4px}
#calendar{right:12px;bottom:56px;width:360px;padding:18px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-head b{font-size:14px}
.cal-nav{display:flex;gap:4px}
.cal-nav button{width:28px;height:28px;border-radius:5px;display:grid;place-items:center}
.cal-nav button:hover{background:var(--hover)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .wd{font-size:11px;color:var(--dim);padding:6px 0;font-weight:600}
.cal-grid .d{font-size:12.5px;padding:7px 0;border-radius:50%;cursor:pointer;transition:.1s}
.cal-grid .d:hover{background:var(--hover)}
.cal-grid .d.other{opacity:.32}
.cal-grid .d.today{background:var(--accent);color:#fff;font-weight:700}
.cal-news{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);line-height:1.6}
#taskview{
  position:fixed;inset:0 0 48px 0;z-index:9995;
  background:rgba(0,0,0,.55);backdrop-filter:blur(24px);
  display:flex;align-items:center;justify-content:center;gap:26px;flex-wrap:wrap;
  padding:60px;opacity:0;pointer-events:none;transition:opacity .2s;
}
#taskview.open{opacity:1;pointer-events:auto}
.tv-card{
  width:280px;height:190px;border-radius:10px;overflow:hidden;
  background:var(--win);border:1px solid var(--line);
  box-shadow:0 14px 44px rgba(0,0,0,.5);
  display:flex;flex-direction:column;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.tv-card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 22px 60px rgba(0,0,0,.65)}
.tv-head{height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12px;background:var(--win2)}
.tv-body{flex:1;display:grid;place-items:center;font-size:44px;opacity:.4}
.tv-close{
  position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:4px;
  display:grid;place-items:center;font-size:11px;background:rgba(0,0,0,.1);
}
.tv-close:hover{background:#e81123;color:#fff}
.tv-wrap{position:relative}

/* ============================================================
   MENU CHUỘT PHẢI
   ============================================================ */
#ctxmenu{
  position:fixed;z-index:20000;min-width:230px;padding:6px;
  background:var(--glass);backdrop-filter:blur(40px) saturate(1.7);
  -webkit-backdrop-filter:blur(40px) saturate(1.7);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transform:scale(.97);transform-origin:top left;
  transition:opacity .1s,transform .1s;
}
#ctxmenu.open{opacity:1;pointer-events:auto;transform:scale(1)}
.ctx-item{
  display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:5px;
  font-size:13px;transition:background .1s;width:100%;text-align:left;
}
.ctx-item:hover{background:var(--hover)}
.ctx-item .ic{width:18px;text-align:center;font-size:14px;opacity:.85}
.ctx-sep{height:1px;background:var(--line);margin:5px 10px}

/* ============================================================
   TOAST
   ============================================================ */
#toasts{position:fixed;right:14px;bottom:60px;z-index:19000;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  min-width:260px;max-width:340px;padding:14px 16px;
  background:var(--glass);backdrop-filter:blur(34px) saturate(1.6);
  -webkit-backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);
  font-size:13px;line-height:1.45;
  animation:toastIn .25s cubic-bezier(.2,.9,.3,1);
}
.toast b{display:block;font-size:12.5px;margin-bottom:3px}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateX(40px);transition:.3s}

/* ============================================================
   STYLE DÙNG CHUNG CHO ỨNG DỤNG
   ============================================================ */
.app-toolbar{
  display:flex;align-items:center;gap:6px;padding:8px 12px;
  border-bottom:1px solid var(--line);background:var(--win2);flex-wrap:wrap;
}
.app-btn{
  padding:6px 12px;border-radius:5px;font-size:12.5px;transition:background .12s;
  display:inline-flex;align-items:center;gap:6px;
}
.app-btn:hover{background:var(--hover)}
.app-btn.primary{background:var(--accent);color:#fff}
.app-btn.primary:hover{filter:brightness(1.12)}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:100%;gap:12px;color:var(--dim);font-size:13px;text-align:center;padding:30px;
}
.empty-state .big{font-size:52px;opacity:.35}

/* ---------- NOTEPAD ---------- */
.np-bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--win2)}
.np-btn{padding:6px 11px;border-radius:5px;font-size:12.5px}
.np-btn:hover{background:var(--hover)}
.np-info{margin-left:auto;font-size:11.5px;color:var(--dim)}
.np-text{
  width:100%;height:100%;border:none;outline:none;resize:none;
  padding:16px 18px;background:transparent;line-height:1.65;
  font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:14px;
}
.win-body:has(.np-bar){display:flex;flex-direction:column;overflow:hidden}

/* ---------- CALCULATOR ---------- */
.calc{display:flex;flex-direction:column;height:100%;padding:10px;gap:10px}
.calc-disp{
  padding:16px 18px 12px;text-align:right;border-radius:8px;background:var(--win2);
  display:flex;flex-direction:column;justify-content:flex-end;min-height:110px;
}
.calc-hist{font-size:12px;color:var(--dim);min-height:16px;word-break:break-all}
.calc-main{font-size:38px;font-weight:300;word-break:break-all;line-height:1.15}
.calc-keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{
  border-radius:7px;background:var(--win2);font-size:17px;transition:.1s;
  display:grid;place-items:center;
}
.calc-keys button:hover{background:var(--hover)}
.calc-keys button:active{transform:scale(.95)}
.calc-keys .op{background:rgba(128,128,128,.14)}
.calc-keys .eq{background:var(--accent);color:#fff}
.calc-keys .eq:hover{filter:brightness(1.15)}

/* ---------- FILE EXPLORER ---------- */
.fe{display:flex;height:100%;overflow:hidden}
.fe-side{
  width:190px;flex:0 0 190px;padding:10px 8px;overflow-y:auto;
  border-right:1px solid var(--line);background:var(--win2);
}
.fe-side h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:8px 10px 5px}
.fe-nav{
  display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:6px;
  font-size:13px;transition:background .12s;width:100%;text-align:left;
}
.fe-nav:hover{background:var(--hover)}
.fe-nav.on{background:var(--active);font-weight:600}
.fe-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.fe-top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.fe-navbtn{width:30px;height:30px;border-radius:5px;display:grid;place-items:center;font-size:14px}
.fe-navbtn:hover{background:var(--hover)}

.fe-crumb{

/* ---------- TERMINAL ---------- */
.term{
  height:100%;padding:12px 14px;overflow-y:auto;background:#0c0c0c;color:#cccccc;
  font-family:"Cascadia Code",Consolas,"Courier New",monospace;font-size:13px;line-height:1.5;
}
.term .ok{color:#16c60c}
.term .err{color:#e74856}
.term .info{color:#3b78ff}

.set{display:flex;height:100%;overflow:hidden}

.set-main{flex:1;overflow-y:auto;padding:26px 32px}
.set-main h2{font-size:20px;margin-bottom:20px;font-weight:600}

.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0}

.set-row .sb{font-size:11.5px;color:var(--dim);margin-top:2px}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:12px}
.wall-th{height:66px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.15s;background-size:cover;background-position:center}

.wall-th.on{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,120,212,.3)}
.acc-grid{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.acc-dot{width:34px;height:34px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:.15s}
.acc-dot:hover{transform:scale(1.1)}
.acc-dot.on{border-color:var(--text);box-shadow:0 0 0 2px var(--win2)}
.seg{display:inline-flex;background:var(--win2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{padding:7px 18px;font-size:12.5px;transition:.12s}
.seg button.on{background:var(--accent);color:#fff}

/* ---------- PAINT ---------- */
.paint{display:flex;flex-direction:column;height:100%;overflow:hidden}
.paint-tools{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--win2);flex-wrap:wrap}
.paint-tools input[type=color]{width:34px;height:30px;border:1px solid var(--line);border-radius:5px;background:none;cursor:pointer;padding:2px}
.paint-tools input[type=range]{width:100px;accent-color:var(--accent)}
.paint-wrap{flex:1;overflow:hidden;background:#fff;position:relative}
.paint-wrap canvas{display:block;cursor:crosshair;touch-action:none}

/* ---------- PHOTOS ---------- */
.ph-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;padding:14px}
.ph-item{aspect-ratio:1;border-radius:8px;cursor:pointer;transition:.15s;background-size:cover;background-position:center}
.ph-item:hover{transform:scale(1.03);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.ph-view{position:absolute;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:5}

.ms-c1{color:#1976d2}.ms-c2{color:#388e3c}.ms-c3{color:#d32f2f}.ms-c4{color:#7b1fa2}
.ms-c5{color:#ff8f00}.ms-c6{color:#0097a7}.ms-c7{color:#455a64}.ms-c8{color:#616161}

/* ---------- SNAKE ---------- */
.snake{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.snake canvas{border-radius:10px;background:#0b1220;box-shadow:0 8px 30px rgba(0,0,0,.35);touch-action:none}
.snake .hud{display:flex;gap:26px;font-size:13px}

/* ---------- MUSIC ---------- */
.mu{height:100%;display:flex;flex-direction:column;padding:20px;gap:16px}

  height:180px;border-radius:12px;display:grid;place-items:center;font-size:64px;

}
.mu-info{text-align:center}

.mu-bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .25s linear}
.mu-time{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.mu-ctrl{display:flex;align-items:center;justify-content:center;gap:16px}
.mu-ctrl button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:17px;transition:.12s}

.mu-list{flex:1;overflow-y:auto;border-top:1px solid var(--line);padding-top:10px}
.mu-track{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:6px;font-size:12.5px;width:100%;text-align:left}
.mu-track:hover{background:var(--hover)}
.mu-track.on{background:var(--active);font-weight:600}
.mu-track .n{margin-left:auto;color:var(--dim);font-size:11px}

/* ---------- BROWSER ---------- */
.br{display:flex;flex-direction:column;height:100%;overflow:hidden}
.br-bar{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--win2)}

.br-bar button:hover{background:var(--hover)}
.br-url{
  flex:1;height:32px;padding:0 14px;border-radius:16px;border:1px solid var(--line);
  background:var(--win);outline:none;font-size:12.5px;
}

/* ---------- TASK MANAGER ---------- */
.tm{height:100%;display:flex;flex-direction:column;overflow:hidden}
.tm-head{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:10px 16px;font-size:11.5px;font-weight:600;color:var(--dim);border-bottom:1px solid var(--line);background:var(--win2)}
.tm-row{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;padding:10px 16px;font-size:12.5px;align-items:center;border-bottom:1px solid var(--line);transition:background .1s}
.tm-row:hover{background:var(--hover)}
.tm-row .nm{display:flex;align-items:center;gap:9px}
.tm-row .end{padding:4px 10px;border-radius:4px;background:var(--hover);font-size:11px;width:fit-content}

.tm-bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}

/* ---------- CLOCK ---------- */
.ck{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}

<script>
/* ============================================================
   0. TIỆN ÍCH
   ============================================================ */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');

/* ============================================================
   1. DỮ LIỆU TĨNH
   ============================================================ */
const WALLPAPERS = [
  'radial-gradient(circle at 25% 20%, #1e6fd9 0%, #0b2a52 45%, #050d1a 100%)',
  'linear-gradient(135deg,#667eea 0%,#764ba2 100%)',
  'linear-gradient(135deg,#0f2027 0%,#203a43 50%,#2c5364 100%)',
  'linear-gradient(135deg,#f6d365 0%,#fda085 100%)',
  'linear-gradient(135deg,#a8edea 0%,#fed6e3 100%)',
  'linear-gradient(135deg,#30cfd0 0%,#330867 100%)',
  'linear-gradient(135deg,#ff9a9e 0%,#fad0c4 55%,#fbc2eb 100%)',
  'linear-gradient(135deg,#141e30 0%,#243b55 100%)',
  'radial-gradient(circle at 70% 30%, #12c2e9, #c471ed 45%, #f64f59 100%)',
  'linear-gradient(135deg,#232526 0%,#414345 100%)'
];

const ACCENTS = ['#0078d4', '#4cc2ff', '#8764b8', '#e74856', '#16c60c', '#ff8c00', '#0099bc', '#c239b3'];

/* Hệ thống tệp giả lập */
const FS = {
  name: 'This PC', type: 'folder', children: [
    { name: 'Desktop', type: 'folder', children: [
      { name: 'Ghi chú nhanh.txt', type: 'file', size: '1 KB' },
      { name: 'Ảnh chụp màn hình.png', type: 'file', size: '842 KB' }
    ]},
    { name: 'Documents', type: 'folder', children: [
      { name: 'Báo cáo.docx', type: 'file', size: '24 KB' },
      { name: 'Kế hoạch.xlsx', type: 'file', size: '18 KB' },
      { name: 'Thuyết trình.pptx', type: 'file', size: '2.4 MB' },
      { name: 'Dự án Web', type: 'folder', children: [
        { name: 'index.html', type: 'file', size: '8 KB' },
        { name: 'style.css', type: 'file', size: '4 KB' },
        { name: 'script.js', type: 'file', size: '12 KB' },
        { name: 'assets', type: 'folder', children: [
          { name: 'logo.svg', type: 'file', size: '3 KB' },
          { name: 'banner.jpg', type: 'file', size: '512 KB' }
        ]}
      ]}
    ]},
    { name: 'Downloads', type: 'folder', children: [
      { name: 'setup.exe', type: 'file', size: '68 MB' },
      { name: 'tai-lieu.pdf', type: 'file', size: '1.2 MB' },
      { name: 'nhac.mp3', type: 'file', size: '4.8 MB' }
    ]},
    { name: 'Pictures', type: 'folder', children: [
      { name: 'hoang-hon.jpg', type: 'file', size: '2.1 MB' },
      { name: 'nui-rung.jpg', type: 'file', size: '3.4 MB' },
      { name: 'bien-xanh.jpg', type: 'file', size: '1.9 MB' }
    ]},
    { name: 'Music', type: 'folder', children: [
      { name: 'Track 01.mp3', type: 'file', size: '5.1 MB' },
      { name: 'Track 02.mp3', type: 'file', size: '4.6 MB' }
    ]},
    { name: 'Videos', type: 'folder', children: [
      { name: 'demo.mp4', type: 'file', size: '124 MB' }
    ]},
    { name: 'Ổ đĩa C:', type: 'drive', children: [
      { name: 'Windows', type: 'folder', children: [
        { name: 'System32', type: 'folder', children: [] }
      ]},
      { name: 'Program Files', type: 'folder', children: [] },
      { name: 'Users', type: 'folder', children: [] }
    ]}
  ]
};

/* ============================================================
   2. TRẠNG THÁI
   ============================================================ */
const state = {
  z: 100,
  activeId: null,
  theme: localStorage.getItem('win_theme') || 'light',
  wallpaper: +(localStorage.getItem('win_wall') || 0),
  accent: localStorage.getItem('win_accent') || '#0078d4',
  brightness: 100
};
const wins = new Map();
let seq = 0;

const desktopEl = $('#desktop');
const layerEl = $('#windows-layer');

/* ============================================================
   3. GIAO DIỆN NỀN TẢNG
   ============================================================ */
function applyTheme() {
  document.body.classList.toggle('dark', state.theme === 'dark');
  document.documentElement.style.setProperty('--accent', state.accent);
  localStorage.setItem('win_theme', state.theme);
  localStorage.setItem('win_accent', state.accent);
}
function applyWallpaper() {
  const wp = WALLPAPERS[state.wallpaper % WALLPAPERS.length];
  desktopEl.style.backgroundImage = wp;
  $('#lock').style.backgroundImage = wp;
  localStorage.setItem('win_wall', state.wallpaper);
}

/* Toast */
function showToast(title, msg = '', icon = 'ℹ️') {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<b>' + icon + ' ' + esc(title) + '</b>' + (msg ? esc(msg) : '');
  $('#toasts').appendChild(t);
  setTimeout(() => {
    t.classList.add('out');
    setTimeout(() => t.remove(), 350);
  }, 3200);
}

/* ============================================================
   4. ĐỒNG HỒ
   ============================================================ */
function tickClock() {
  const d = new Date();
  const hhmm = pad(d.getHours()) + ':' + pad(d.getMinutes());
  $('#lockTime').textContent = hhmm;
  $('#tbTime').textContent = hhmm;
  $('#tbDate').textContent = pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
  const days = ['Chủ nhật', 'Thứ hai', 'Thứ ba', 'Thứ tư', 'Thứ năm', 'Thứ sáu', 'Thứ bảy'];
  $('#lockDate').textContent = days[d.getDay()] + ', ' + d.getDate() + ' tháng ' + (d.getMonth() + 1);
}
setInterval(tickClock, 1000);
tickClock();

/* ============================================================
   5. BOOT → LOCK → DESKTOP
   ============================================================ */
setTimeout(() => {
  $('#boot').classList.add('hide');
}, 2400);

function goToLogin() {
  $('#lockTimeView').style.display = 'none';
  $('#lockLoginView').style.display = 'flex';
}
function unlock() {
  $('#lock').classList.add('hide');
  setTimeout(() => {
    $('#lock').style.display = 'none';
    showToast('Chào mừng trở lại!', 'Nhấn ⊞ hoặc phím Windows để mở Start.', '👋');
  }, 650);
}
$('#lock').addEventListener('click', (e) => {
  if ($('#lockLoginView').style.display === 'none') goToLogin();
});
document.addEventListener('keydown', (e) => {
  if ($('#lock').style.display !== 'none' && !$('#lock').classList.contains('hide')) {
    if ($('#lockLoginView').style.display === 'none') goToLogin();
  }
});
$('#lockBtn').addEventListener('click', (e) => { e.stopPropagation(); unlock(); });

/* ============================================================
   6. ICON DESKTOP
   ============================================================ */

/* ============================================================
   8. QUẢN LÝ CỬA SỔ
   ============================================================ */
function focusWin(id) {
  const w = wins.get(id);
  if (!w) return;
  state.activeId = id;
  w.el.style.zIndex = ++state.z;
  wins.forEach(x => x.el.classList.toggle('focused', x.id === id));
  renderTaskbar();
}

function openApp(appId, opts = {}) {
  const app = APPS[appId];
  if (!app) { showToast('Không tìm thấy', 'Ứng dụng "' + appId + '" không tồn tại.', '⚠️'); return; }

  /* Nếu đã mở → focus */
  for (const w of wins.values()) {
    if (w.appId === appId) {
      if (w.minimized) restoreWin(w.id);
      focusWin(w.id);
      if (app.onReopen) app.onReopen(w);
      return w.id;
    }
  }

  const id = 'win-' + (++seq);
  const DW = desktopEl.clientWidth, DH = desktopEl.clientHeight;
  const W = Math.min(app.w || 780, Math.max(320, DW - 60));
  const H = Math.min(app.h || 540, Math.max(200, DH - 50));
  const off = (wins.size % 6) * 26;
  const left = Math.max(8, Math.round((DW - W) / 2 - 70 + off));
  const top = Math.max(8, Math.round((DH - H) / 2 - 40 + off));

  const el = document.createElement('div');
  el.className = 'window focused';
  el.style.cssText = 'left:' + left + 'px;top:' + top + 'px;width:' + W + 'px;height:' + H + 'px;z-index:' + (++state.z);
  el.innerHTML =
    '<div class="titlebar">' +
      '<div class="tb-icon">' + app.icon + '</div>' +
      '<div class="tb-title">' + esc(app.name) + '</div>' +
      '<div class="tb-controls">' +
        '<button class="min" title="Thu nhỏ"><svg width="10" height="10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1"/></svg></button>' +
        '<button class="max" title="Phóng to"><svg width="10" height="10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/></svg></button>' +
        '<button class="close" title="Đóng"><svg width="10" height="10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1"/></svg></button>' +
      '</div>' +
    '</div>' +
    '<div class="win-body"></div>' +
    '<div class="rz rz-n"></div><div class="rz rz-s"></div><div class="rz rz-w"></div><div class="rz rz-e"></div>' +
    '<div class="rz rz-nw"></div><div class="rz rz-ne"></div><div class="rz rz-sw"></div><div class="rz rz-se"></div>';

  layerEl.appendChild(el);

  const winObj = { id, appId, el, minimized: false, maximized: false, snapped: false, prev: null };
  wins.set(id, winObj);

  const bodyEl = el.querySelector('.win-body');
  try { app.build(bodyEl, winObj, opts); }
  catch (err) { bodyEl.innerHTML = '<div class="empty-state"><div class="big">⚠️</div>Lỗi tải ứng dụng</div>'; console.error(err); }

  /* Sự kiện điều khiển */
  el.querySelector('.min').addEventListener('click', (e) => { e.stopPropagation(); minimizeWin(id); });
  el.querySelector('.max').addEventListener('click', (e) => { e.stopPropagation(); toggleMax(id); });
  el.querySelector('.close').addEventListener('click', (e) => { e.stopPropagation(); closeWin(id); });
  el.querySelector('.titlebar').addEventListener('dblclick', (e) => {
    if (e.target.closest('.tb-controls')) return;
    toggleMax(id);
  });
  el.addEventListener('pointerdown', () => focusWin(id));

  /* Kéo */
  el.querySelector('.titlebar').addEventListener('pointerdown', (e) => startDrag(e, winObj));

  /* Resize */
  el.querySelectorAll('.rz').forEach(h => {
    h.addEventListener('pointerdown', (e) => startResize(e, winObj, h.classList[1].replace('rz-', '')));
  });

  focusWin(id);
  renderTaskbar();
  return id;
}

function minimizeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.minimized = true;
  w.el.classList.add('min');
  if (state.activeId === id) state.activeId = null;
  renderTaskbar();
}
function restoreWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.minimized = false;
  w.el.classList.remove('min');
  focusWin(id);
}
function closeWin(id) {
  const w = wins.get(id);
  if (!w) return;
  w.el.style.transition = 'opacity .14s, transform .14s';
  w.el.style.opacity = '0';
  w.el.style.transform = 'scale(.95)';
  setTimeout(() => w.el.remove(), 140);
  wins.delete(id);
  if (state.activeId === id) state.activeId = null;
  renderTaskbar();
}
function toggleMax(id) {
  const w = wins.get(id);
  if (!w) return;
  if (w.maximized || w.snapped) {
    w.el.classList.remove('max');
    w.maximized = false; w.snapped = false;
    if (w.prev) Object.assign(w.el.style, w.prev);
  } else {
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.el.classList.add('max');
    w.el.style.left = '0px'; w.el.style.top = '0px';
    w.el.style.width = '100%'; w.el.style.height = '100%';
    w.maximized = true;
  }
  focusWin(id);
}

/* ---------- SNAP ---------- */
function applySnap(id, pos) {
  const w = wins.get(id);
  if (!w) return;
  if (!w.maximized && !w.snapped) {
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
  }
  const DW = desktopEl.clientWidth, DH = desktopEl.clientHeight;
  let g;
  if (pos === 'max')        g = { l: 0, t: 0, w: DW, h: DH };
  else if (pos === 'left')  g = { l: 0, t: 0, w: Math.round(DW / 2), h: DH };
  else if (pos === 'right') g = { l: Math.round(DW / 2), t: 0, w: Math.round(DW / 2), h: DH };
  else if (pos === 'tl')    g = { l: 0, t: 0, w: Math.round(DW / 2), h: Math.round(DH / 2) };
  else if (pos === 'tr')    g = { l: Math.round(DW / 2), t: 0, w: Math.round(DW / 2), h: Math.round(DH / 2) };
  else if (pos === 'bl')    g = { l: 0, t: Math.round(DH / 2), w: Math.round(DW / 2), h: Math.round(DH / 2) };
  else if (pos === 'br')    g = { l: Math.round(DW / 2), t: Math.round(DH / 2), w: Math.round(DW / 2), h: Math.round(DH / 2) };
  w.el.classList.add('max');
  Object.assign(w.el.style, { left: g.l + 'px', top: g.t + 'px', width: g.w + 'px', height: g.h + 'px' });
  w.maximized = (pos === 'max');
  w.snapped = true;
  focusWin(id);
}

/* ---------- KÉO CỬA SỔ ---------- */
let dragCtx = null;
const snapPrev = $('#snap-preview');

function startDrag(e, w) {
  if (e.button !== 0) return;
  focusWin(w.id);

  /* Nếu đang max/snap → khôi phục kích thước để kéo tiếp */
  if (w.maximized || w.snapped) {
    const pw = parseFloat(w.prev && w.prev.width) || 800;
    const ph = parseFloat(w.prev && w.prev.height) || 520;
    w.el.classList.remove('max');
    w.maximized = false; w.snapped = false;
    w.el.style.width = pw + 'px';
    w.el.style.height = ph + 'px';
    w.el.style.left = Math.max(0, e.clientX - pw / 2) + 'px';
    w.el.style.top = Math.max(0, e.clientY - 19) + 'px';
  }

  const r = w.el.getBoundingClientRect();
  const dr = desktopEl.getBoundingClientRect();
  dragCtx = {
    w,
    offX: e.clientX - r.left,
    offY: e.clientY - r.top,
    desktopTop: dr.top,
    snap: null
  };
  w.el.classList.add('dragging');
  document.addEventListener('pointermove', onDragMove);
  document.addEventListener('pointerup', onDragEnd);
  e.preventDefault();
}

function onDragMove(e) {
  if (!dragCtx) return;
  const { w, offX, offY } = dragCtx;
  let x = e.clientX - offX;
  let y = e.clientY - offY - dragCtx.desktopTop;

  /* Giới hạn nhẹ */
  x = Math.max(-w.el.offsetWidth + 80, Math.min(x, desktopEl.clientWidth - 80));
  y = Math.max(0, Math.min(y, desktopEl.clientHeight - 40));

  w.el.style.left = x + 'px';
  w.el.style.top = y + 'px';

  /* Phát hiện snap */
  const DW = desktopEl.clientWidth, DH = desktopEl.clientHeight;
  let snap = null;
  if (e.clientY <= dragCtx.desktopTop + 6) snap = 'max';
  else if (e.clientX <= 6) snap = 'left';
  else if (e.clientX >= window.innerWidth - 6) snap = 'right';
  else if (e.clientY <= dragCtx.desktopTop + 70 && e.clientX <= 90) snap = 'tl';
  else if (e.clientY <= dragCtx.desktopTop + 70 && e.clientX >= window.innerWidth - 90) snap = 'tr';
  else if (e.clientY >= dragCtx.desktopTop + DH - 60 && e.clientX <= 90) snap = 'bl';
  else if (e.clientY >= dragCtx.desktopTop + DH - 60 && e.clientX >= window.innerWidth - 90) snap = 'br';

  dragCtx.snap = snap;

  if (snap) {
    let g;
    if (snap === 'max')        g = { l: 0, t: dragCtx.desktopTop, w: DW, h: DH };
    else if (snap === 'left')  g = { l: 0, t: dragCtx.desktopTop, w: DW / 2, h: DH };
    else if (snap === 'right') g = { l: DW / 2, t: dragCtx.desktopTop, w: DW / 2, h: DH };
    else if (snap === 'tl')    g = { l: 0, t: dragCtx.desktopTop, w: DW / 2, h: DH / 2 };
    else if (snap === 'tr')    g = { l: DW / 2, t: dragCtx.desktopTop, w: DW / 2, h: DH / 2 };
    else if (snap === 'bl')    g = { l: 0, t: dragCtx.desktopTop + DH / 2, w: DW / 2, h: DH / 2 };
    else if (snap === 'br')    g = { l: DW / 2, t: dragCtx.desktopTop + DH / 2, w: DW / 2, h: DH / 2 };
    Object.assign(snapPrev.style, {
      left: g.l + 'px', top: g.t + 'px',
      width: g.w + 'px', height: g.h + 'px'
    });
    snapPrev.classList.add('on');
  } else {
    snapPrev.classList.remove('on');
  }
}

function onDragEnd() {
  if (!dragCtx) return;
  const { w, snap } = dragCtx;
  w.el.classList.remove('dragging');
  snapPrev.classList.remove('on');
  if (snap) applySnap(w.id, snap);
  dragCtx = null;
  document.removeEventListener('pointermove', onDragMove);
  document.removeEventListener('pointerup', onDragEnd);
}

/* ---------- RESIZE ---------- */
let resizeCtx = null;
function startResize(e, w, dir) {
  focusWin(w.id);
  const r = w.el.getBoundingClientRect();
  resizeCtx = {
    w, dir,
    startX: e.clientX, startY: e.clientY,
    startW: r.width, startH: r.height,
    startL: parseFloat(w.el.style.left) || 0,
    startT: parseFloat(w.el.style.top) || 0
  };
  if (w.maximized || w.snapped) {
    w.el.classList.remove('max');
    w.maximized = false; w.snapped = false;
  }
  document.addEventListener('pointermove', onResizeMove);
  document.addEventListener('pointerup', onResizeEnd);
  e.preventDefault(); e.stopPropagation();
}
function onResizeMove(e) {
  if (!resizeCtx) return;
  const c = resizeCtx;
  const dx = e.clientX - c.startX;
  const dy = e.clientY - c.startY;
  const MIN_W = 300, MIN_H = 170;
  let nw = c.startW, nh = c.startH, nl = c.startL, nt = c.startT;

  if (c.dir.includes('e')) nw = Math.max(MIN_W, c.startW + dx);
  if (c.dir.includes('s')) nh = Math.max(MIN_H, c.startH + dy);
  if (c.dir.includes('w')) {
    nw = Math.max(MIN_W, c.startW - dx);
    nl = c.startL + (c.startW - nw);
  }
  if (c.dir.includes('n')) {
    nh = Math.max(MIN_H, c.startH - dy);
    nt = c.startT + (c.startH - nh);
  }

  c.w.el.style.width = nw + 'px';
  c.w.el.style.height = nh + 'px';
  c.w.el.style.left = nl + 'px';
  c.w.el.style.top = nt + 'px';
}
function onResizeEnd() {
  resizeCtx = null;
  document.removeEventListener('pointermove', onResizeMove);
  document.removeEventListener('pointerup', onResizeEnd);
}

/* ============================================================
   9. TASKBAR
   ============================================================ */
const PINNED = ['explorer', 'browser', 'notepad', 'terminal', 'settings', 'paint', 'calculator', 'music'];

function renderTaskbar() {
  const c = $('#tbCenter');
  c.innerHTML = '';

  /* Nút Start */
  const startBtn = document.createElement('button');
  startBtn.className = 'tbtn';
  startBtn.innerHTML = '<svg width="22" height="22" viewBox="0 0 22 22"><rect x="0" y="0" width="10" height="10" rx="1.5" fill="#4cc2ff"/><rect x="12" y="0" width="10" height="10" rx="1.5" fill="#4cc2ff"/><rect x="0" y="12" width="10" height="10" rx="1.5" fill="#4cc2ff"/><rect x="12" y="12" width="10" height="10" rx="1.5" fill="#4cc2ff"/></svg>';
  startBtn.title = 'Bắt đầu';
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleStart(); });
  c.appendChild(startBtn);

  /* Tìm kiếm */
  const searchBtn = document.createElement('button');
  searchBtn.className = 'tbtn';
  searchBtn.innerHTML = '🔍';
  searchBtn.title = 'Tìm kiếm';
  searchBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openStart();
    setTimeout(() => $('#startSearch').focus(), 120);
  });
  c.appendChild(searchBtn);

  /* Task View */
  const tvBtn = document.createElement('button');
  tvBtn.className = 'tbtn';
  tvBtn.innerHTML = '🗂️';
  tvBtn.title = 'Chế độ xem tác vụ';
  tvBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleTaskView(); });
  c.appendChild(tvBtn);

  /* Ứng dụng đã ghim + đang chạy */
  const running = new Set(Array.from(wins.values()).map(w => w.appId));
  const shown = new Set();
  PINNED.forEach(appId => {
    const app = APPS[appId];
    if (!app) return;
    shown.add(appId);
    c.appendChild(makeTaskBtn(appId, app));
  });
  running.forEach(appId => {
    if (shown.has(appId)) return;
    const app = APPS[appId];
    if (!app) return;
    c.appendChild(makeTaskBtn(appId, app));
  });
}

function makeTaskBtn(appId, app) {
  const b = document.createElement('button');
  const isRunning = Array.from(wins.values()).some(w => w.appId === appId);
  const win = Array.from(wins.values()).find(w => w.appId === appId);
  b.className = 'tbtn' + (isRunning ? ' run' : '') + (state.activeId === (win && win.id) ? ' act' : '');
  b.innerHTML = app.icon;
  b.title = app.name;
  b.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!win) { openApp(appId); return; }
    if (win.minimized) restoreWin(win.id);
    else if (state.activeId === win.id) minimizeWin(win.id);
    else focusWin(win.id);
  });
  return b;
}

function closePanels(except = []) {

}

}

/* Calendar */
let calMonth = new Date().getMonth();
let calYear = new Date().getFullYear();
function renderCalendar() {
  const months = ['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
  $('#calTitle').textContent = months[calMonth] + ' ' + calYear;
  const grid = $('#calGrid');
  grid.innerHTML = '';
  ['CN','T2','T3','T4','T5','T6','T7'].forEach(d => {
    const e = document.createElement('div');
    e.className = 'wd';
    e.textContent = d;
    grid.appendChild(e);
  });
  const first = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const prevDays = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();

  for (let i = first - 1; i >= 0; i--) {
    const e = document.createElement('div');
    e.className = 'd other';
    e.textContent = prevDays - i;
    grid.appendChild(e);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const e = document.createElement('div');
    e.className = 'd';
    if (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear()) e.classList.add('today');
    e.textContent = d;
    grid.appendChild(e);
  }
  const total = first + daysInMonth;
  const rest = (7 - (total % 7)) % 7;
  for (let d = 1; d <= rest; d++) {
    const e = document.createElement('div');
    e.className = 'd other';
    e.textContent = d;
    grid.appendChild(e);
  }
}
$('#calPrev').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; }
  renderCalendar();
});
$('#calNext').addEventListener('click', (e) => {
  e.stopPropagation();
  calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; }
  renderCalendar();
});

function renderTaskView() {
  const tv = $('#taskview');

    tv.innerHTML = '<div style="color:#fff;font-size:15px;opacity:.7">Không có cửa sổ nào đang mở</div>';
    return;
  }
  wins.forEach(w => {
    const app = APPS[w.appId];
    const wrap = document.createElement('div');
    wrap.className = 'tv-wrap';
    wrap.innerHTML =
      '<div class="tv-card">' +
        '<div class="tv-head">' + app.icon + ' ' + esc(app.name) + '</div>' +
        '<div class="tv-body">' + app.icon + '</div>' +
      '</div>' +
      '<button class="tv-close">✕</button>';

/* ---------------- CALCULATOR ---------------- */
APPS.calculator = {
  name: 'Máy tính', icon: '🧮', w: 340, h: 540,
  build(body, win) {
    body.innerHTML =
      '<div class="calc">' +
        '<div class="calc-disp"><div class="calc-hist"></div><div class="calc-main">0</div></div>' +
        '<div class="calc-keys">' +
          '<button data-k="C" class="op">C</button>' +
          '<button data-k="back" class="op">⌫</button>' +
          '<button data-k="%" class="op">%</button>' +
          '<button data-k="/" class="op">÷</button>' +
          '<button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="*" class="op">×</button>' +
          '<button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="op">−</button>' +
          '<button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="+" class="op">+</button>' +
          '<button data-k="neg">±</button><button data-k="0">0</button><button data-k=".">.</button><button data-k="=" class="eq">=</button>' +
        '</div>' +
      '</div>';

    const disp = body.querySelector('.calc-main');
    const hist = body.querySelector('.calc-hist');
    let expr = '';

    const show = () => {
      disp.textContent = expr === '' ? '0' : expr.replace(/\*/g, '×').replace(/\//g, '÷').replace(/-/g, '−');
    };

    const calc = () => {
      try {
        let safe = expr.replace(/%/g, '/100');
        safe = safe.replace(/[^0-9+\-*/.()]/g, '');
        if (!safe) return '';
        // eslint-disable-next-line no-new-func
        const r = Function('"use strict";return (' + safe + ')')();
        if (!isFinite(r) || isNaN(r)) return 'Lỗi';
        const rounded = Math.round(r * 1e12) / 1e12;
        return String(rounded);
      } catch (e) { return 'Lỗi'; }
    };

    function press(k) {
      if (k === 'C') { expr = ''; hist.textContent = ''; show(); return; }
      if (k === 'back') { expr = expr.slice(0, -1); show(); return; }
      if (k === 'neg') { expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr; show(); return; }
      if (k === '=') {
        if (!expr) return;
        const res = calc();
        hist.textContent = expr.replace(/\*/g, '×').replace(/\//g, '÷') + ' =';
        expr = res === 'Lỗi' ? '' : res;
        if (res === 'Lỗi') hist.textContent = 'Biểu thức không hợp lệ';
        show();
        return;
      }
      if (/[0-9.]/.test(k)) {
        /* tránh nhiều dấu chấm trong 1 số */
        if (k === '.') {
          const parts = expr.split(/[+\-*/%()]/);
          if (parts[parts.length - 1].includes('.')) return;
          if (expr === '' || /[+\-*/%]$/.test(expr)) expr += '0';
        }
        expr += k;
      } else {
        if (expr === '' && k !== '-') return;
        if (/[+\-*/%]$/.test(expr)) expr = expr.slice(0, -1) + k;
        else expr += k;
      }
      show();
    }

    body.querySelectorAll('.calc-keys button').forEach(b => {
      b.addEventListener('click', () => press(b.dataset.k));
    });

    /* Bàn phím */
    document.addEventListener('keydown', function handler(e) {
      if (state.activeId !== win.id) return;
      if (!document.body.contains(body)) { document.removeEventListener('keydown', handler); return; }
      const k = e.key;
      if (/^[0-9]$/.test(k)) press(k);
      else if (k === '+') press('+');
      else if (k === '-') press('-');
      else if (k === '*') press('*');
      else if (k === '/') { e.preventDefault(); press('/'); }
      else if (k === '.') press('.');
      else if (k === '%') press('%');
      else if (k === 'Enter' || k === '=') { e.preventDefault(); press('='); }
      else if (k === 'Backspace') press('back');
      else if (k === 'Escape') press('C');
    });
    show();
  }
};

/* ---------------- FILE EXPLORER ---------------- */
APPS.explorer = {
  name: 'File Explorer', icon: '📁', w: 900, h: 580,
  build(body, win, opts) {
    body.innerHTML =
      '<div class="fe">' +
        '<div class="fe-side"></div>' +
        '<div class="fe-main">' +
          '<div class="fe-top">' +
            '<button class="fe-navbtn" data-n="back">‹</button>' +
            '<button class="fe-navbtn" data-n="fwd">›</button>' +
            '<button class="fe-navbtn" data-n="up">↑</button>' +
            '<div class="fe-crumb"></div>' +
            '<button class="fe-navbtn" data-n="refresh">🔄</button>' +
          '</div>' +
          '<div class="fe-items"></div>' +
          '<div class="fe-status"></div>' +
        '</div>' +
      '</div>';

    let path = [];              // mảng tên thư mục
    const history = [[]];
    let hIndex = 0;

    const itemsEl = body.querySelector('.fe-items');
    const crumbEl = body.querySelector('.fe-crumb');
    const statusEl = body.querySelector('.fe-status');

    function findNode(p) {
      let node = FS;
      for (const name of p) {
        if (!node.children) return null;
        const next = node.children.find(c => c.name === name);
        if (!next) return null;
        node = next;
      }
      return node;
    }

    function iconFor(node) {
      if (node.type === 'drive') return '💽';
      if (node.type === 'folder') return '📁';
      const n = node.name.toLowerCase();
      if (/\.(png|jpg|jpeg|gif|bmp|svg)$/.test(n)) return '🖼️';
      if (/\.(mp3|wav|flac)$/.test(n)) return '🎵';
      if (/\.(mp4|avi|mkv|mov)$/.test(n)) return '🎬';
      if (/\.(txt|md|log)$/.test(n)) return '📄';
      if (/\.(doc|docx)$/.test(n)) return '📘';
      if (/\.(xls|xlsx|csv)$/.test(n)) return '📗';
      if (/\.(ppt|pptx)$/.test(n)) return '📙';
      if (/\.(zip|rar|7z)$/.test(n)) return '🗜️';
      if (/\.(exe|msi)$/.test(n)) return '⚙️';
      if (/\.(html|css|js|json|xml)$/.test(n)) return '🧾';
      return '📄';
    }

    function renderSide() {
      const side = body.querySelector('.fe-side');
      side.innerHTML = '<h4>Truy cập nhanh</h4>';
      const quick = [
        { n: 'This PC', ic: '🖥️', p: [] },
        { n: 'Desktop', ic: '🖼️', p: ['Desktop'] },
        { n: 'Documents', ic: '📄', p: ['Documents'] },
        { n: 'Downloads', ic: '⬇️', p: ['Downloads'] },
        { n: 'Pictures', ic: '🌄', p: ['Pictures'] },
        { n: 'Music', ic: '🎵', p: ['Music'] },
        { n: 'Videos', ic: '🎬', p: ['Videos'] },
        { n: 'Ổ đĩa C:', ic: '💽', p: ['Ổ đĩa C:'] }
      ];
      quick.forEach(q => {
        const b = document.createElement('button');
        b.className = 'fe-nav' + (JSON.stringify(path) === JSON.stringify(q.p) ? ' on' : '');
        b.innerHTML = '<span>' + q.ic + '</span><span>' + esc(q.n) + '</span>';
        b.addEventListener('click', () => navigate(q.p));
        side.appendChild(b);
      });
    }

    function renderCrumb() {
      crumbEl.innerHTML = '';
      const parts = ['This PC'].concat(path);
      parts.forEach((p, i) => {
        const s = document.createElement('span');
        s.textContent = p;
        s.addEventListener('click', () => navigate(path.slice(0, i)));
        crumbEl.appendChild(s);
        if (i < parts.length - 1) {
          const sep = document.createElement('i');
          sep.textContent = '›';
          crumbEl.appendChild(sep);
        }
      });
    }

    function render() {
      const node = findNode(path);
      itemsEl.innerHTML = '';
      if (!node || !node.children) {
        itemsEl.innerHTML = '<div class="empty-state"><div class="big">📂</div>Thư mục trống</div>';
        statusEl.textContent = '0 mục';
        return;
      }
      const items = node.children.slice().sort((a, b) => {
        if (a.type === 'folder' && b.type !== 'folder') return -1;
        if (a.type !== 'folder' && b.type === 'folder') return 1;
        return a.name.localeCompare(b.name);
      });

      if (items.length === 0) {
        itemsEl.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="big">📂</div>Thư mục này trống</div>';
      }

      items.forEach(item => {
        const el = document.createElement('div');
        el.className = 'fe-item';
        el.innerHTML = '<div class="em">' + iconFor(item) + '</div><div class="nm">' + esc(item.name) + '</div>';
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          $$('.fe-item', itemsEl).forEach(x => x.classList.remove('sel'));
          el.classList.add('sel');
        });
        el.addEventListener('dblclick', (e) => {
          e.stopPropagation();
          if (item.type === 'folder' || item.type === 'drive') {
            navigate(path.concat(item.name));
          } else {
            showToast('Mở tệp', item.name + ' (' + (item.size || '—') + ')', iconFor(item));
          }
        });
        el.addEventListener('contextmenu', (e) => {
          e.preventDefault(); e.stopPropagation();
          $$('.fe-item', itemsEl).forEach(x => x.classList.remove('sel'));
          el.classList.add('sel');
          showContextMenu(e.clientX, e.clientY, [
            { label: 'Mở', icon: '📂', action: () => {
              if (item.type === 'folder') navigate(path.concat(item.name));
              else showToast('Mở tệp', item.name, '📄');
            }},
            { label: 'Sao chép', icon: '📋', action: () => showToast('Đã sao chép', item.name, '📋') },
            { label: 'Đổi tên', icon: '✏️', action: () => showToast('Không khả dụng', 'Môi trường giả lập chỉ đọc.', '⚠️') },
            { sep: true },
            { label: 'Xóa', icon: '🗑️', action: () => showToast('Đã xóa', item.name, '🗑️') },
            { label: 'Thuộc tính', icon: 'ℹ️', action: () => showToast('Thuộc tính', item.name + ' — ' + (item.size || 'Thư mục'), 'ℹ️') }
          ]);
        });
        itemsEl.appendChild(el);
      });

      const folders = items.filter(i => i.type === 'folder' || i.type === 'drive').length;
      const files = items.length - folders;
      statusEl.textContent = items.length + ' mục  ·  ' + folders + ' thư mục, ' + files + ' tệp';

      renderCrumb();
      renderSide();
    }

    function navigate(newPath) {
      path = newPath.slice();
      history.splice(hIndex + 1);
      history.push(path.slice());
      hIndex = history.length - 1;
      render();
    }

    body.querySelector('[data-n="back"]').addEventListener('click', () => {
      if (hIndex > 0) { hIndex--; path = history[hIndex].slice(); render(); }
    });
    body.querySelector('[data-n="fwd"]').addEventListener('click', () => {
      if (hIndex < history.length - 1) { hIndex++; path = history[hIndex].slice(); render(); }
    });
    body.querySelector('[data-n="up"]').addEventListener('click', () => {
      if (path.length > 0) navigate(path.slice(0, -1));
    });
    body.querySelector('[data-n="refresh"]').addEventListener('click', render);

    itemsEl.addEventListener('click', () => $$('.fe-item', itemsEl).forEach(x => x.classList.remove('sel')));

    render();
  }
};

      date() { print('Ngày hiện tại: ' + new Date().toLocaleDateString('vi-VN')); },
      time() { print('Giờ hiện tại: ' + new Date().toLocaleTimeString('vi-VN')); },
      whoami() { print('desktop-web\\guest'); },
      dir() {
        print(' Thư mục: ' + cwd);
        print('&nbsp;');
        const names = ['Desktop', 'Documents', 'Downloads', 'Pictures', 'Music', 'Videos'];
        names.forEach(n => {
          print('  &lt;DIR&gt;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + n);
        });
        print('&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;' + names.length + ' thư mục');
        print('&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;0 tệp');
      },
      cd(args) {
        if (!args) { print(cwd); return; }
        if (args === '..') {
          const parts = cwd.split('\\');
          if (parts.length > 1) parts.pop();
          cwd = parts.join('\\') || 'C:\\';
        } else if (args === '\\' || args === '/') {
          cwd = 'C:\\';
        } else {
          cwd = cwd.replace(/\\$/, '') + '\\' + args;
        }
        print('Đã chuyển đến: ' + cwd);
      },
      echo(args) { print(esc(args)); },
      ipconfig() {
        print('&nbsp;');
        print('Cấu hình IP Windows');
        print('&nbsp;');
        print('Bộ điều hợp Ethernet:');
        print('&nbsp;&nbsp;&nbsp;IPv4 Address. . . . . . . . . . . : 192.168.1.100');
        print('&nbsp;&nbsp;&nbsp;Subnet Mask . . . . . . . . . . . : 255.255.255.0');
        print('&nbsp;&nbsp;&nbsp;Default Gateway . . . . . . . . . : 192.168.1.1');
      },
      systeminfo() {
        print('Tên máy chủ:        DESKTOP-WEB');
        print('Hệ điều hành:       Windows 11 Pro (Web Simulator)');
        print('Phiên bản:          10.0.22631 Build 22631');
        print('Nhà sản xuất:       JavaScript Engine');
        print('Bộ xử lý:           ' + (navigator.hardwareConcurrency || 4) + ' lõi ảo');
        print('Bộ nhớ vật lý:      ' + (navigator.deviceMemory || 8) + ' GB (mô phỏng)');
        print('Ngôn ngữ:           ' + navigator.language);
        print('Độ phân giải:       ' + screen.width + 'x' + screen.height);
      },
      color() {
        const colors = ['ok', 'err', 'info', 'warn'];
        const c = colors[Math.floor(Math.random() * colors.length)];
        print('<span class="' + c + '">Màu chữ đã được thay đổi!</span>');
      },
      calc() { openApp('calculator'); print('Đang mở Máy tính...', 'info'); },
      notepad() { openApp('notepad'); print('Đang mở Notepad...', 'info'); },
      explorer() { openApp('explorer'); print('Đang mở File Explorer...', 'info'); },
      cls() { out.innerHTML = ''; },
      exit() { print('Đang đóng Terminal...', 'info'); setTimeout(() => closeWin(win.id), 400); }
    };

    function run(raw) {
      const line = raw.trim();
      print('<span class="term-prompt">' + cwd + '&gt;</span> ' + esc(raw));
      if (!line) return;
      historyCmds.push(line);
      histIdx = historyCmds.length;

      const parts = line.split(/\s+/);
      const cmd = parts[0].toLowerCase();
      const args = line.slice(parts[0].length).trim();

      if (COMMANDS[cmd]) {
        try { COMMANDS[cmd](args); }
        catch (e) { print('Lỗi khi thực thi lệnh.', 'err'); }
      } else {
        print("'" + esc(parts[0]) + "' không được nhận diện là lệnh nội bộ hoặc bên ngoài,", 'err');
        print('chương trình có thể thực thi hoặc tệp bó.', 'err');
      }
      print('&nbsp;');
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const v = input.value;
        input.value = '';
        run(v);
      } else if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (histIdx > 0) { histIdx--; input.value = historyCmds[histIdx] || ''; }
      } else if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx < historyCmds.length - 1) { histIdx++; input.value = historyCmds[histIdx] || ''; }
        else { histIdx = historyCmds.length; input.value = ''; }
      }
    });

    termEl.addEventListener('click', () => input.focus());
    setTimeout(() => input.focus(), 120);
  }
};

APPS.paint = {
  name: 'Paint', icon: '🎨', w: 860, h: 580,
  build(body) {
    body.style.overflow = 'hidden';
    body.innerHTML =
      '<div class="paint">' +
        '<div class="paint-tools">' +
          '<input type="color" class="p-color" value="#0078d4" title="Màu vẽ" />' +
          '<input type="range" class="p-size" min="1" max="50" value="4" title="Cỡ bút" />' +
          '<span class="p-size-label" style="font-size:12px;color:var(--dim);min-width:38px">4 px</span>' +
          '<button class="app-btn" data-t="brush">🖌️ Bút</button>' +
          '<button class="app-btn" data-t="eraser">🧽 Tẩy</button>' +
          '<button class="app-btn" data-t="clear">🗑️ Xóa hết</button>' +
          '<button class="app-btn" data-t="save">💾 Tải PNG</button>' +
        '</div>' +
        '<div class="paint-wrap"><canvas class="p-canvas"></canvas></div>' +
      '</div>';

    const wrap = body.querySelector('.paint-wrap');
    const canvas = body.querySelector('.p-canvas');
    const ctx = canvas.getContext('2d');
    const colorInput = body.querySelector('.p-color');
    const sizeInput = body.querySelector('.p-size');
    const sizeLabel = body.querySelector('.p-size-label');

    let tool = 'brush';
    let drawing = false;
    let lastX = 0, lastY = 0;

    function fit() {
      const r = wrap.getBoundingClientRect();
      if (r.width < 10 || r.height < 10) return;
      const img = canvas.width > 0 ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
      canvas.width = Math.floor(r.width);
      canvas.height = Math.floor(r.height);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      if (img) {
        try { ctx.putImageData(img, 0, 0); } catch (e) {}
      }
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
    }
    requestAnimationFrame(fit);

    const ro = new ResizeObserver(() => { /* giữ đơn giản, không auto-resize */ });
    ro.observe(wrap);

    function pos(e) {
      const r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      canvas.setPointerCapture(e.pointerId);
      const p = pos(e);
      lastX = p.x; lastY = p.y;
      ctx.beginPath();
      ctx.arc(p.x, p.y, (tool === 'eraser' ? +sizeInput.value * 2 : +sizeInput.value) / 2, 0, Math.PI * 2);
      ctx.fillStyle = tool === 'eraser' ? '#ffffff' : colorInput.value;
      ctx.fill();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : colorInput.value;
      ctx.lineWidth = tool === 'eraser' ? +sizeInput.value * 2 : +sizeInput.value;
      ctx.stroke();
      lastX = p.x; lastY = p.y;
    });

    canvas.addEventListener('pointerup', () => { drawing = false; });
    canvas.addEventListener('pointerleave', () => { drawing = false; });

    sizeInput.addEventListener('input', () => { sizeLabel.textContent = sizeInput.value + ' px'; });

    body.querySelectorAll('.paint-tools .app-btn').forEach(b => {
      b.addEventListener('click', () => {
        const t = b.dataset.t;
        if (t === 'brush' || t === 'eraser') {
          tool = t;
          body.querySelectorAll('.paint-tools .app-btn').forEach(x => x.classList.remove('primary'));
          b.classList.add('primary');
        } else if (t === 'clear') {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
        } else if (t === 'save') {
          const a = document.createElement('a');
          a.download = 'ban-ve.png';
          a.href = canvas.toDataURL('image/png');
          a.click();
          showToast('Paint', 'Đã tải xuống bản vẽ của bạn.', '💾');
        }
      });
    });
    body.querySelector('[data-t="brush"]').classList.add('primary');
  }
};

APPS.minesweeper = {
  name: 'Dò mìn', icon: '💣', w: 420, h: 540,
  build(body) {
    const ROWS = 9, COLS = 9, MINES = 10;
    body.innerHTML =
      '<div class="ms">' +
        '<div class="ms-head">' +
          '<div class="ms-num" id="msMines">💣 10</div>' +
          '<button class="ms-face" id="msFace">🙂</button>' +
          '<div class="ms-num" id="msTime">⏱️ 000</div>' +
        '</div>' +
        '<div class="ms-board" id="msBoard"></div>' +
      '</div>';

    const boardEl = body.querySelector('#msBoard');
    const faceEl = body.querySelector('#msFace');
    const minesEl = body.querySelector('#msMines');
    const timeEl = body.querySelector('#msTime');

    let grid, revealed, flagged, gameOver, started, timer, seconds, flagsLeft;

    boardEl.style.gridTemplateColumns = 'repeat(' + COLS + ', 32px)';

    function idx(r, c) { return r * COLS + c; }
    function inBounds(r, c) { return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
    function neighbors(r, c) {
      const out = [];
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++) {
          if (dr === 0 && dc === 0) continue;
          if (inBounds(r + dr, c + dc)) out.push([r + dr, c + dc]);
        }
      return out;
    }

    function reset() {
      clearInterval(timer);
      seconds = 0;
      started = false;
      gameOver = false;
      flagsLeft = MINES;
      revealed = Array(ROWS * COLS).fill(false);
      flagged = Array(ROWS * COLS).fill(false);
      grid = Array(ROWS * COLS).fill(0);
      faceEl.textContent = '🙂';
      timeEl.textContent = '⏱️ 000';
      minesEl.textContent = '💣 ' + String(flagsLeft).padStart(3, '0');
      draw();
    }

    function placeMines(safeR, safeC) {
      let placed = 0;
      while (placed < MINES) {
        const r = Math.floor(Math.random() * ROWS);
        const c = Math.floor(Math.random() * COLS);
        if (grid[idx(r, c)] === -1) continue;
        if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
        grid[idx(r, c)] = -1;
        placed++;
      }
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (grid[idx(r, c)] === -1) continue;
          let n = 0;
          neighbors(r, c).forEach(([nr, nc]) => { if (grid[idx(nr, nc)] === -1) n++; });
          grid[idx(r, c)] = n;
        }
      }
    }

    function draw() {
      boardEl.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const i = idx(r, c);
          const cell = document.createElement('div');
          cell.className = 'ms-cell';
          if (revealed[i]) {
            cell.classList.add('open');
            if (grid[i] === -1) {
              cell.classList.add('mine');
              cell.textContent = '💣';
            } else if (grid[i] > 0) {
              cell.textContent = grid[i];
              cell.classList.add('ms-c' + grid[i]);
            }
          } else if (flagged[i]) {
            cell.textContent = '🚩';
          }
          cell.addEventListener('click', () => reveal(r, c));
          cell.addEventListener('contextmenu', (e) => { e.preventDefault(); flag(r, c); });
          boardEl.appendChild(cell);
        }
      }
    }

    function reveal(r, c) {
      if (gameOver) return;
      const i = idx(r, c);
      if (revealed[i] || flagged[i]) return;

      if (!started) {
        started = true;
        placeMines(r, c);
        timer = setInterval(() => {
          seconds = Math.min(999, seconds + 1);
          timeEl.textContent = '⏱️ ' + String(seconds).padStart(3, '0');
        }, 1000);
      }

      if (grid[i] === -1) {
        revealed[i] = true;
        gameOver = true;
        clearInterval(timer);
        faceEl.textContent = '😵';
        for (let k = 0; k < ROWS * COLS; k++) if (grid[k] === -1) revealed[k] = true;
        draw();
        showToast('Thua rồi!', 'Bạn đã chạm phải mìn 💣', '💥');
        return;
      }

      /* Mở lan */
      const stack = [[r, c]];
      while (stack.length) {
        const [cr, cc] = stack.pop();
        const ci = idx(cr, cc);
        if (revealed[ci] || flagged[ci]) continue;
        revealed[ci] = true;
        if (grid[ci] === 0) {
          neighbors(cr, cc).forEach(([nr, nc]) => {
            if (!revealed[idx(nr, nc)]) stack.push([nr, nc]);
          });
        }
      }

      draw();
      checkWin();
    }

    function flag(r, c) {
      if (gameOver) return;
      const i = idx(r, c);
      if (revealed[i]) return;
      if (!flagged[i] && flagsLeft <= 0) return;
      flagged[i] = !flagged[i];
      flagsLeft += flagged[i] ? -1 : 1;
      minesEl.textContent = '💣 ' + String(Math.max(0, flagsLeft)).padStart(3, '0');
      draw();
      checkWin();
    }

    function checkWin() {
      let openCount = 0;
      for (let i = 0; i < ROWS * COLS; i++) if (revealed[i]) openCount++;
      if (openCount === ROWS * COLS - MINES) {
        gameOver = true;
        clearInterval(timer);
        faceEl.textContent = '😎';
        showToast('Chiến thắng!', 'Bạn đã dọn sạch bãi mìn trong ' + seconds + ' giây.', '🏆');
      }
    }

    faceEl.addEventListener('click', reset);
    reset();
  }
};

APPS.snake = {
  name: 'Rắn săn mồi', icon: '🐍', w: 520, h: 600,
  build(body, win) {
    body.innerHTML =
      '<div class="snake">' +
        '<div class="hud"><span>Điểm: <b id="skScore">0</b></span><span>Kỷ lục: <b id="skBest">0</b></span></div>' +
        '<canvas id="skCanvas" width="420" height="420"></canvas>' +
        '<div style="font-size:12px;color:var(--dim)">Dùng phím ← ↑ → ↓ hoặc W A S D để di chuyển · Enter để chơi lại</div>' +
      '</div>';

    const canvas = body.querySelector('#skCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = body.querySelector('#skScore');
    const bestEl = body.querySelector('#skBest');

    const CELL = 21;
    const COLS = 20, ROWS = 20;

    let snake, dir, nextDir, food, score, running, dead, loopId;
    let best = +(localStorage.getItem('snake_best') || 0);
    bestEl.textContent = best;

    function reset() {
      clearInterval(loopId);
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      dead = false;
      running = true;
      scoreEl.textContent = '0';
      placeFood();
      draw();
      loopId = setInterval(step, 110);
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
      } while (snake.some(s => s.x === food.x && s.y === food.y));
    }

    function step() {
      if (!running) return;
      dir = nextDir;
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
          snake.some(s => s.x === head.x && s.y === head.y)) {
        running = false;
        dead = true;
        clearInterval(loopId);
        draw();
        if (score > best) {
          best = score;
          localStorage.setItem('snake_best', best);
          bestEl.textContent = best;
        }
        showToast('Game Over', 'Điểm của bạn: ' + score, '🐍');
        return;
      }

      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        placeFood();
      } else {
        snake.pop();
      }
      draw();
    }

    function draw() {
      ctx.fillStyle = '#0b1220';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      /* Lưới mờ */
      ctx.strokeStyle = 'rgba(255,255,255,.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(COLS * CELL, i * CELL); ctx.stroke();
      }

      /* Mồi */
      ctx.fillStyle = '#e81123';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();

      /* Rắn */
      snake.forEach((s, i) => {
        const t = i / Math.max(1, snake.length - 1);
        ctx.fillStyle = i === 0 ? '#4cc2ff' : 'hsl(' + (200 - t * 40) + ',80%,' + (60 - t * 20) + '%)';
        const pad = i === 0 ? 1 : 2;
        roundRect(ctx, s.x * CELL + pad, s.y * CELL + pad, CELL - pad * 2, CELL - pad * 2, 5);
        ctx.fill();
      });

      /* Mắt */
      if (snake.length) {
        const h = snake[0];
        ctx.fillStyle = '#0b1220';
        const cx = h.x * CELL + CELL / 2, cy = h.y * CELL + CELL / 2;
        const ox = dir.x * 4, oy = dir.y * 4;
        const px = dir.x === 0 ? 4 : 0, py = dir.y === 0 ? 4 : 0;
        ctx.beginPath(); ctx.arc(cx + ox - px, cy + oy - py, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + ox + px, cy + oy + py, 2, 0, Math.PI * 2); ctx.fill();
      }

      if (dead) {
        ctx.fillStyle = 'rgba(0,0,0,.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '600 26px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = '15px Segoe UI, sans-serif';
        ctx.fillStyle = '#a8b6cc';
        ctx.fillText('Nhấn Enter để chơi lại', canvas.width / 2, canvas.height / 2 + 26);
      }
    }

    function roundRect(c, x, y, w, h, r) {
      c.beginPath();
      c.moveTo(x + r, y);
      c.arcTo(x + w, y, x + w, y + h, r);
      c.arcTo(x + w, y + h, x, y + h, r);
      c.arcTo(x, y + h, x, y, r);
      c.arcTo(x, y, x + w, y, r);
      c.closePath();
    }

    function setDir(nx, ny) {
      if (!running) return;
      if (nx === -dir.x && ny === -dir.y) return;
      nextDir = { x: nx, y: ny };
    }

    document.addEventListener('keydown', function handler(e) {
      if (!document.body.contains(body)) { document.removeEventListener('keydown', handler); return; }
      if (state.activeId !== win.id) return;
      const k = e.key.toLowerCase();
      if (k === 'arrowup' || k === 'w') { e.preventDefault(); setDir(0, -1); }
      else if (k === 'arrowdown' || k === 's') { e.preventDefault(); setDir(0, 1); }
      else if (k === 'arrowleft' || k === 'a') { e.preventDefault(); setDir(-1, 0); }
      else if (k === 'arrowright' || k === 'd') { e.preventDefault(); setDir(1, 0); }
      else if (k === 'enter' && dead) { reset(); }
    });

    reset();
  }
};

APPS.music = {
  name: 'Âm nhạc', icon: '🎵', w: 460, h: 620,
  build(body) {
    const tracks = [
      { name: 'Ánh Bình Minh', artist: 'Nova Sound', dur: 214, grad: 'linear-gradient(135deg,#667eea,#764ba2)' },
      { name: 'Đêm Sài Gòn', artist: 'Saigon Beats', dur: 187, grad: 'linear-gradient(135deg,#f093fb,#f5576c)' },
