<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crossword Puzzle - Generations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .game-container {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 900px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      margin-bottom: 20px;
      font-size: 26px;
    }
    .grid-container {
      display: grid;
      gap: 2px;
      justify-content: center;
      margin-bottom: 30px;
      background: #2c3e50;
      padding: 2px;
      border-radius: 8px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #fff;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .cell.empty {
      background: transparent;
      border: none;
    }
    .cell input {
      width: 100%;
      height: 100%;
      border: none;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      outline: none;
      background: transparent;
      color: #2c3e50;
    }
    .cell input:focus {
      background: #e8f4fd;
    }
    .cell input.correct {
      background: #d4edda;
      color: #155724;
    }
    .cell input.incorrect {
      background: #f8d7da;
      color: #721c24;
    }
    .clues-container {
      display: flex;
      gap: 40px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    .clues-section {
      flex: 1;
      min-width: 250px;
    }
    .clues-section h3 {
      color: #2c3e50;
      margin-bottom: 12px;
      border-bottom: 2px solid #eee;
      padding-bottom: 8px;
      font-size: 18px;
    }
    .clues-section ul {
      list-style: none;
      padding: 0;
    }
    .clues-section li {
      margin-bottom: 12px;
      line-height: 1.5;
      color: #444;
      font-size: 15px;
    }
    .controls {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 28px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    #checkBtn { background: #3498db; color: white; }
    #revealBtn { background: #e74c3c; color: white; }
    #resetBtn { background: #95a5a6; color: white; }
  </style>
</head>
<body>

<div class="game-container">
  <h1>🧩 Crossword Puzzle: Generations</h1>
  <div class="grid-container" id="gridContainer"></div>
  
  <div class="clues-container">
    <div class="clues-section">
      <h3>Across</h3>
      <ul id="acrossClues"></ul>
    </div>
    <div class="clues-section">
      <h3>Down</h3>
      <ul id="downClues"></ul>
    </div>
  </div>

  <div class="controls">
    <button id="checkBtn">Check Answers</button>
    <button id="revealBtn">Reveal Answers</button>
    <button id="resetBtn">Reset</button>
  </div>
</div>

<script>
  // Dữ liệu câu hỏi và đáp án (Dựa theo hình ảnh)
  const words = [
    { id: 1, direction: 'across', row: 3, col: 0, answer: 'LIFEEXPECTANCY', clue: 'The number of years that a person is likely to live' },
    { id: 2, direction: 'down', row: 0, col: 1, answer: 'NUTRIENTS', clue: 'Things to keep a living thing alive and help it grow' },
    { id: 3, direction: 'down', row: 0, col: 2, answer: 'WORKOUT', clue: 'Do physical exercise' },
    { id: 4, direction: 'down', row: 0, col: 3, answer: 'HEALTHYHABITS', clue: 'Start by looking at food labels, paying attention to ingredients and nutrients, such as vitamins' }
  ];

  const gridSize = 15;
  const grid = Array.from({ length: gridSize }, () => Array(gridSize).fill(null));

  // Đặt từ vào lưới
  words.forEach(word => {
    for (let i = 0; i < word.answer.length; i++) {
      const r = word.direction === 'across' ? word.row : word.row + i;
      const c = word.direction === 'across' ? word.col + i : word.col;
      if (r < gridSize && c < gridSize) {
        if (!grid[r][c]) {
          grid[r][c] = { letter: word.answer[i], wordIds: [word.id] };
        } else {
          grid[r][c].wordIds.push(word.id);
        }
      }
    }
  });

  // Tạo HTML cho lưới ô chữ
  const gridContainer = document.getElementById('gridContainer');
  gridContainer.style.gridTemplateColumns = `repeat(${gridSize}, 32px)`;

  for (let r = 0; r < gridSize; r++) {
    for (let c = 0; c < gridSize; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (grid[r][c]) {
        const input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 1;
        input.dataset.row = r;
        input.dataset.col = c;
        input.dataset.letter = grid[r][c].letter;
        input.dataset.wordIds = grid[r][c].wordIds.join(',');
        cell.appendChild(input);
      } else {
        cell.classList.add('empty');
      }
      gridContainer.appendChild(cell);
    }
  }

  // Tạo danh sách gợi ý
  const acrossClues = document.getElementById('acrossClues');
  const downClues = document.getElementById('downClues');

  words.forEach(word => {
    const li = document.createElement('li');
    li.textContent = `${word.id}. ${word.clue} (${word.answer.length} letters)`;
    if (word.direction === 'across') {
      acrossClues.appendChild(li);
    } else {
      downClues.appendChild(li);
    }
  });

  // Tự động chuyển sang ô tiếp theo khi gõ
  gridContainer.addEventListener('input', (e) => {
    if (e.target.tagName === 'INPUT') {
      e.target.value = e.target.value.toUpperCase();
      const inputs = Array.from(gridContainer.querySelectorAll('input'));
      const index = inputs.indexOf(e.target);
      if (index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
    }
  });

  // Nút kiểm tra đáp án
  document.getElementById('checkBtn').addEventListener('click', () => {
    const inputs = gridContainer.querySelectorAll('input');
    inputs.forEach(input => {
      if (input.value === input.dataset.letter) {
        input.classList.add('correct');
        input.classList.remove('incorrect');
      } else {
        input.classList.add('incorrect');
        input.classList.remove('correct');
      }
    });
  });

  // Nút hiện đáp án
  document.getElementById('revealBtn').addEventListener('click', () => {
    const inputs = gridContainer.querySelectorAll('input');
    inputs.forEach(input => {
      input.value = input.dataset.letter;
      input.classList.remove('correct', 'incorrect');
    });
  });

  // Nút làm lại
  document.getElementById('resetBtn').addEventListener('click', () => {
    const inputs = gridContainer.querySelectorAll('input');
    inputs.forEach(input => {
      input.value = '';
      input.classList.remove('correct', 'incorrect');
    });
  });
</script>
</body>
</html>
