<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reveal the Picture - Generations</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #fff;
  }
  h1 { font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); text-align: center; }
  .subtitle { opacity: 0.85; margin-bottom: 20px; font-size: 14px; text-align: center; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; }
  .stat {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2); text-align: center;
  }
  .stat .label { font-size: 12px; opacity: 0.8; }
  .stat .value { font-size: 22px; font-weight: bold; }

  .board-wrap {
    position: relative; width: 400px; height: 400px;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .picture {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #f39c12, #e74c3c, #8e44ad, #3498db);
    background-size: 300% 300%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 80px; text-align: center;
    animation: bgShift 8s ease infinite;
  }
  @keyframes bgShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .picture .word {
    font-size: 32px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    margin-top: 10px; letter-spacing: 2px;
  }
  .grid {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px; background: rgba(0,0,0,0.3);
  }
  .tile {
    background: linear-gradient(135deg, #2c3e50, #4a6785);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; color: #fff;
    cursor: pointer; transition: all 0.4s ease;
    border: none; font-family: inherit; position: relative; overflow: hidden;
  }
  .tile:hover:not(.revealed) {
    background: linear-gradient(135deg, #3d5a80, #5f7fa8);
    transform: scale(1.02); z-index: 2;
  }
  .tile.revealed {
    opacity: 0; pointer-events: none;
    transform: scale(1.2) rotate(10deg);
  }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; color: #222; border-radius: 20px;
    padding: 30px; max-width: 500px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h3 {
    font-size: 18px; margin-bottom: 20px;
    color: #2c3e50; line-height: 1.4;
  }
  .options { display: grid; gap: 10px; }
  .option {
    padding: 14px 18px; background: #f0f4f8;
    border: 2px solid transparent; border-radius: 12px;
    cursor: pointer; font-size: 15px; text-align: left;
    font-family: inherit; transition: all 0.2s; color: #222;
  }
  .option:hover { background: #e1e8f0; border-color: #4a6785; }
  .option.correct {
    background: #d4edda; border-color: #28a745;
    color: #155724; font-weight: bold;
  }
  .option.wrong {
    background: #f8d7da; border-color: #dc3545; color: #721c24;
  }
  .feedback {
    margin-top: 15px; padding: 12px; border-radius: 10px;
    font-weight: bold; text-align: center; display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #d4edda; color: #155724; }
  .feedback.no { background: #f8d7da; color: #721c24; }

  .btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    font-family: inherit; margin-top: 20px; transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }

  .guess-area { margin-top: 20px; text-align: center; display: none; }
  .guess-area.show { display: block; }
  .guess-area input {
    padding: 12px 16px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15); color: #fff;
    font-size: 16px; font-family: inherit;
    width: 220px; outline: none;
  }
  .guess-area input::placeholder { color: rgba(255,255,255,0.6); }

  .toast {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #fff; color: #222; padding: 14px 24px;
    border-radius: 12px; font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.4s ease; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>👨‍👩‍👧‍👦 Reveal the Picture</h1>
<p class="subtitle">Answer correctly to open a tile — guess the final word to win!</p>

<div class="stats">
  <div class="stat"><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="stat"><div class="label">Opened</div><div class="value" id="opened">0/9</div></div>
</div>

<div class="board-wrap">
  <div class="picture">
    <div>👨‍👩‍👧‍👦</div>
    <div class="word">GENERATIONS</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="guess-area" id="guessArea">
  <input type="text" id="guessInput" placeholder="Enter the secret word...">
  <button class="btn" onclick="checkGuess()">Guess</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="questionText"></h3>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  { 
    q: "When was Generation X born?", 
    options: ["From 1965 to 1980", "From 1980 to 1990", "From late 1990s to early 2010s", "From 2010 to now"], 
    correct: 0 
  },
  { 
    q: "What is a notable characteristic of Generation X?", 
    options: ["Being digital natives", "Being critical thinkers", "Avoiding changes", "Preferring to work alone"], 
    correct: 1 
  },
  { 
    q: "What is another name for Generation Y?", 
    options: ["Generation Alpha", "Digital Natives", "Millennials", "Gen Xers"], 
    correct: 2 
  },
  { 
    q: "What do Millennials (Generation Y) value when working together?", 
    options: ["Working independently", "Teamwork", "Strict rules", "Avoiding new ideas"], 
    correct: 1 
  },
  { 
    q: "When was Generation Z born?", 
    options: ["From 1965 to 1980", "From early 1980s to late 1990s", "From late 1990s to early 2010s", "From 2010 to 2020"], 
    correct: 2 
  },
  { 
    q: "Why is Generation Z called 'digital natives'?", 
    options: ["They invented the internet", "They grew up online and never knew the world before digital media", "They don't like technology", "They only use phones for work"], 
    correct: 1 
  },
  { 
    q: "Which trait is specifically associated with Generation Z?", 
    options: ["Being critical thinkers", "Being very creative", "Valuing teamwork above all", "Being afraid of changes"], 
    correct: 1 
  },
  { 
    q: "What do many Gen Zers prefer to do instead of relying on someone to hire them?", 
    options: ["Work for big companies", "Start their own businesses", "Stop working", "Work for the government"], 
    correct: 1 
  },
  { 
    q: "What do Generation Y (Millennials) do when working in a team?", 
    options: ["Ignore others' ideas", "Welcome different points of view and ideas from others", "Only follow the leader", "Prefer to work alone"], 
    correct: 1 
  },
  { 
    q: "What is the name of the new generation mentioned at the end of the text?", 
    options: ["Generation Y", "Generation Z", "Generation Alpha", "Generation Beta"], 
    correct: 2 
  }
];

let revealed = 0, score = 0, currentTile = null;
const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
const questionText = document.getElementById('questionText');
const optionsEl = document.getElementById('options');
const feedback = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const openedEl = document.getElementById('opened');
const guessArea = document.getElementById('guessArea');
const toast = document.getElementById('toast');

// Shuffle and pick the first 9 questions
const shuffled = [...questions].sort(() => Math.random() - 0.5);

for (let i = 0; i < 9; i++) {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.textContent = i + 1;
  tile.onclick = () => openQuestion(tile, shuffled[i]);
  grid.appendChild(tile);
}

function openQuestion(tile, q) {
  currentTile = tile;
  questionText.textContent = q.q;
  optionsEl.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(65 + idx) + '. ' + opt;
    btn.onclick = () => answer(btn, idx, q.correct);
    optionsEl.appendChild(btn);
  });
  modal.classList.add('show');
}

function answer(btn, chosen, correct) {
  [...optionsEl.children].forEach(b => b.onclick = null);
  if (chosen === correct) {
    btn.classList.add('correct');
    feedback.className = 'feedback show ok';
    feedback.textContent = '✅ Correct! Opening tile...';
    score++; scoreEl.textContent = score;
    setTimeout(() => { modal.classList.remove('show'); revealTile(); }, 1200);
  } else {
    btn.classList.add('wrong');
    optionsEl.children[correct].classList.add('correct');
    feedback.className = 'feedback show no';
    feedback.textContent = '❌ Wrong! The correct answer is ' + String.fromCharCode(65 + correct) + '.';
    setTimeout(() => modal.classList.remove('show'), 1800);
  }
}

function revealTile() {
  if (!currentTile) return;
  currentTile.classList.add('revealed');
  revealed++;
  openedEl.textContent = revealed + '/9';
  if (revealed >= 3) guessArea.classList.add('show');
  if (revealed === 9) showToast('🎉 All tiles opened! The secret word is: GENERATIONS');
}

function checkGuess() {
  const val = document.getElementById('guessInput').value.trim().toUpperCase();
  if (['GENERATIONS', 'GENERATION', 'GEN'].includes(val)) {
    showToast('🎉 CORRECT! The secret word is GENERATIONS');
  } else {
    showToast('❌ Not quite, try again!');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
