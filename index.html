<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lật Ô Đoán Hình</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #6a11cb 100%);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px; color: #fff;
  }
  h1 { font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
  .subtitle { opacity: 0.85; margin-bottom: 20px; font-size: 14px; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; }
  .stat {
    background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
    padding: 10px 20px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2); text-align: center;
  }
  .stat .label { font-size: 12px; opacity: 0.8; }
  .stat .value { font-size: 22px; font-weight: bold; }

  .board-wrap {
    position: relative; width: 400px; height: 400px;
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .picture {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #1dd1a1);
    background-size: 300% 300%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 80px; text-align: center;
    animation: bgShift 8s ease infinite;
  }
  @keyframes bgShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .picture .word {
    font-size: 36px; font-weight: 900; color: #fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    margin-top: 10px; letter-spacing: 4px;
  }
  .grid {
    position: absolute; inset: 0;
    display: grid; grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 4px; background: rgba(0,0,0,0.3);
  }
  .tile {
    background: linear-gradient(135deg, #2c3e50, #4a6785);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 900; color: #fff;
    cursor: pointer; transition: all 0.4s ease;
    border: none; font-family: inherit; position: relative; overflow: hidden;
  }
  .tile:hover:not(.revealed) {
    background: linear-gradient(135deg, #3d5a80, #5f7fa8);
    transform: scale(1.02); z-index: 2;
  }
  .tile.revealed {
    opacity: 0; pointer-events: none;
    transform: scale(1.2) rotate(10deg);
  }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff; color: #222; border-radius: 20px;
    padding: 30px; max-width: 500px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: pop 0.3s ease;
  }
  @keyframes pop {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h3 {
    font-size: 18px; margin-bottom: 20px;
    color: #2c3e50; line-height: 1.4;
  }
  .options { display: grid; gap: 10px; }
  .option {
    padding: 14px 18px; background: #f0f4f8;
    border: 2px solid transparent; border-radius: 12px;
    cursor: pointer; font-size: 15px; text-align: left;
    font-family: inherit; transition: all 0.2s; color: #222;
  }
  .option:hover { background: #e1e8f0; border-color: #4a6785; }
  .option.correct {
    background: #d4edda; border-color: #28a745;
    color: #155724; font-weight: bold;
  }
  .option.wrong {
    background: #f8d7da; border-color: #dc3545; color: #721c24;
  }
  .feedback {
    margin-top: 15px; padding: 12px; border-radius: 10px;
    font-weight: bold; text-align: center; display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: #d4edda; color: #155724; }
  .feedback.no { background: #f8d7da; color: #721c24; }

  .btn {
    padding: 12px 30px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: bold; cursor: pointer;
    font-family: inherit; margin-top: 20px; transition: transform 0.2s;
  }
  .btn:hover { transform: translateY(-2px); }

  .guess-area { margin-top: 20px; text-align: center; display: none; }
  .guess-area.show { display: block; }
  .guess-area input {
    padding: 12px 16px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15); color: #fff;
    font-size: 16px; font-family: inherit;
    width: 220px; outline: none;
  }
  .guess-area input::placeholder { color: rgba(255,255,255,0.6); }

  .toast {
    position: fixed; top: 30px; left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #fff; color: #222; padding: 14px 24px;
    border-radius: 12px; font-weight: bold;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    transition: transform 0.4s ease; z-index: 200;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>🌍 Lật Ô Đoán Hình</h1>
<p class="subtitle">Trả lời đúng để mở ô — đoán được hình cuối là thắng!</p>

<div class="stats">
  <div class="stat"><div class="label">Điểm</div><div class="value" id="score">0</div></div>
  <div class="stat"><div class="label">Đã mở</div><div class="value" id="opened">0/9</div></div>
</div>

<div class="board-wrap">
  <div class="picture">
    <div>🌍</div>
    <div class="word">TRÁI ĐẤT</div>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="guess-area" id="guessArea">
  <input type="text" id="guessInput" placeholder="Nhập từ khóa...">
  <button class="btn" onclick="checkGuess()">Đoán</button>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="questionText"></h3>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const questions = [
  { q: "Khí nào chiếm tỉ lệ lớn nhất trong khí quyển Trái Đất?", options: ["Oxy","Nitơ","CO2","Hơi nước"], correct: 1 },
  { q: "Khí nào là nguyên nhân chính gây hiệu ứng nhà kính?", options: ["CO2","Oxy","Nitơ","Heli"], correct: 0 },
  { q: "Nhiệt độ Trái Đất đang có xu hướng nào?", options: ["Giảm","Không đổi","Tăng","Dao động ngẫu nhiên"], correct: 2 },
  { q: "Băng ở khu vực nào đang tan nhanh nhất?", options: ["Sa mạc","Bắc Cực & Nam Cực","Rừng Amazon","Dãy Alps"], correct: 1 },
  { q: "Nguồn năng lượng nào được coi là sạch?", options: ["Than đá","Dầu mỏ","Mặt Trời","Khí tự nhiên"], correct: 2 },
  { q: "Việc làm nào giúp giảm rác thải hiệu quả?", options: ["Đốt rác","Tái chế","Chôn rác","Xả ra sông"], correct: 1 },
  { q: "Trồng nhiều cây xanh có tác dụng gì?", options: ["Tăng CO2","Hấp thụ CO2","Gây lũ lụt","Làm nóng"], correct: 1 },
  { q: "Phương tiện nào thân thiện với môi trường nhất?", options: ["Ô tô","Xe máy","Xe đạp","Máy bay"], correct: 2 },
  { q: "Nguyên nhân chính gây biến đổi khí hậu là gì?", options: ["Núi lửa","Con người","Mặt Trời","Động đất"], correct: 1 }
];

let revealed = 0, score = 0, currentTile = null;
const grid = document.getElementById('grid');
const modal = document.getElementById('modal');
const questionText = document.getElementById('questionText');
const optionsEl = document.getElementById('options');
const feedback = document.getElementById('feedback');
const scoreEl = document.getElementById('score');
const openedEl = document.getElementById('opened');
const guessArea = document.getElementById('guessArea');
const toast = document.getElementById('toast');

const shuffled = [...questions].sort(() => Math.random() - 0.5);

for (let i = 0; i < 9; i++) {
  const tile = document.createElement('button');
  tile.className = 'tile';
  tile.textContent = i + 1;
  tile.onclick = () => openQuestion(tile, shuffled[i]);
  grid.appendChild(tile);
}

function openQuestion(tile, q) {
  currentTile = tile;
  questionText.textContent = q.q;
  optionsEl.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = String.fromCharCode(65 + idx) + '. ' + opt;
    btn.onclick = () => answer(btn, idx, q.correct);
    optionsEl.appendChild(btn);
  });
  modal.classList.add('show');
}

function answer(btn, chosen, correct) {
  [...optionsEl.children].forEach(b => b.onclick = null);
  if (chosen === correct) {
    btn.classList.add('correct');
    feedback.className = 'feedback show ok';
    feedback.textContent = '✅ Chính xác! Mở ô...';
    score++; scoreEl.textContent = score;
    setTimeout(() => { modal.classList.remove('show'); revealTile(); }, 1200);
  } else {
    btn.classList.add('wrong');
    optionsEl.children[correct].classList.add('correct');
    feedback.className = 'feedback show no';
    feedback.textContent = '❌ Sai rồi! Đáp án đúng là ' + String.fromCharCode(65 + correct) + '.';
    setTimeout(() => modal.classList.remove('show'), 1800);
  }
}

function revealTile() {
  if (!currentTile) return;
  currentTile.classList.add('revealed');
  revealed++;
  openedEl.textContent = revealed + '/9';
  if (revealed >= 3) guessArea.classList.add('show');
  if (revealed === 9) showToast('🎉 Mở hết rồi! Từ khóa là: TRÁI ĐẤT');
}

function checkGuess() {
  const val = document.getElementById('guessInput').value.trim().toUpperCase();
  if (['TRÁI ĐẤT','TRAI DAT','EARTH'].includes(val)) {
    showToast('🎉 CHÍNH XÁC! Từ khóa là TRÁI ĐẤT');
  } else {
    showToast('❌ Chưa đúng, thử lại nhé!');
  }
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}
</script>
</body>
</html>
