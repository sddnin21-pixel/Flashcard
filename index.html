      { name: 'Mưa Đầu Mùa', artist: 'Lofi Vietnam', dur: 198, grad: 'linear-gradient(135deg,#43e97b,#38f9d7)' },
      { name: 'Tĩnh Lặng', artist: 'Zen Mode', dur: 302, grad: 'linear-gradient(135deg,#fa709a,#fee140)' }
    ];

    let current = 0;
    let playing = false;
    let pos = 0;
    let timer = null;

    body.innerHTML =
      '<div class="mu">' +
        '<div class="mu-art" id="muArt">🎵</div>' +
        '<div class="mu-info"><b id="muName">—</b><span id="muArtist">—</span></div>' +
        '<div>' +
          '<div class="mu-bar" id="muBar"><i id="muFill"></i></div>' +
          '<div class="mu-time"><span id="muCur">0:00</span><span id="muDur">0:00</span></div>' +
        '</div>' +
        '<div class="mu-ctrl">' +
          '<button id="muPrev">⏮</button>' +
          '<button id="muPlay" class="play">▶</button>' +
          '<button id="muNext">⏭</button>' +
        '</div>' +
        '<div class="mu-list" id="muList"></div>' +
      '</div>';

    const art = body.querySelector('#muArt');
    const nameEl = body.querySelector('#muName');
    const artistEl = body.querySelector('#muArtist');
    const fill = body.querySelector('#muFill');
    const curEl = body.querySelector('#muCur');
    const durEl = body.querySelector('#muDur');
    const listEl = body.querySelector('#muList');
    const playBtn = body.querySelector('#muPlay');

    function fmt(s) {
      return Math.floor(s / 60) + ':' + pad(Math.floor(s % 60));
    }

    function load(i) {
      current = (i + tracks.length) % tracks.length;
      const t = tracks[current];
      pos = 0;
      nameEl.textContent = t.name;
      artistEl.textContent = t.artist;
      art.style.background = t.grad;
      durEl.textContent = fmt(t.dur);
      curEl.textContent = '0:00';
      fill.style.width = '0%';
      renderList();
    }

    function renderList() {
      listEl.innerHTML = '';
      tracks.forEach((t, i) => {
        const b = document.createElement('button');
        b.className = 'mu-track' + (i === current ? ' on' : '');
        b.innerHTML = '<span>' + (i === current && playing ? '🔊' : '🎵') + '</span>' +
                      '<span>' + esc(t.name) + '</span>' +
                      '<span class="n">' + fmt(t.dur) + '</span>';
        b.addEventListener('click', () => { load(i); play(); });
        listEl.appendChild(b);
      });
    }

    function play() {
      playing = true;
      playBtn.textContent = '⏸';
      art.style.animation = 'none';
      clearInterval(timer);
      timer = setInterval(() => {
        if (!playing) return;
        pos += 0.25;
        const t = tracks[current];
        if (pos >= t.dur) { next(); return; }
        fill.style.width = (pos / t.dur * 100) + '%';
        curEl.textContent = fmt(pos);
      }, 250);
      renderList();
    }

    function pause() {
      playing = false;
      playBtn.textContent = '▶';
      clearInterval(timer);
      renderList();
    }

    function next() { load(current + 1); if (playing) play(); }
    function prev() { load(current - 1); if (playing) play(); }

    playBtn.addEventListener('click', () => { playing ? pause() : play(); });
    body.querySelector('#muNext').addEventListener('click', next);
    body.querySelector('#muPrev').addEventListener('click', prev);

    body.querySelector('#muBar').addEventListener('click', (e) => {
      const r = e.currentTarget.getBoundingClientRect();
      const p = (e.clientX - r.left) / r.width;
      pos = p * tracks[current].dur;
      fill.style.width = (p * 100) + '%';
      curEl.textContent = fmt(pos);
    });

    load(0);
  }
};

        const ram = (Math.random() * 90 + 30);
        totalCpu += cpu;
        totalRam += ram;

        const row = document.createElement('div');
        row.className = 'tm-row';
        row.innerHTML =
          '<div class="nm">' + app.icon + ' ' + esc(app.name) + (state.activeId === w.id ? ' <span style="color:var(--accent);font-size:10px">●</span>' : '') + '</div>' +
          '<div>' + cpu.toFixed(1) + '%<div class="tm-bar"><i style="width:' + Math.min(100, cpu * 8) + '%"></i></div></div>' +
          '<div>' + ram.toFixed(1) + ' MB<div class="tm-bar"><i style="width:' + Math.min(100, ram / 2) + '%"></i></div></div>' +
          '<div><button class="end">Kết thúc</button></div>';
        row.querySelector('.end').addEventListener('click', () => {
          closeWin(w.id);
          render();
        });
        rowsEl.appendChild(row);
      });

      footEl.textContent = 'Tiến trình: ' + wins.size +
        '  ·  CPU tổng: ' + totalCpu.toFixed(1) + '%' +
        '  ·  RAM tổng: ' + (totalRam / 1024).toFixed(2) + ' GB';
    }

    render();
    timer = setInterval(() => {
      if (!document.body.contains(body)) { clearInterval(timer); return; }
      render();
    }, 2000);
  }
};

/* ---------------- CLOCK ---------------- */
APPS.clock = {
  name: 'Đồng hồ', icon: '🕐', w: 400, h: 520,
  build(body) {
    body.innerHTML =
      '<div class="ck">' +
        '<canvas id="ckCanvas" width="220" height="220"></canvas>' +
        '<div class="dig" id="ckDig">--:--:--</div>' +
        '<div class="dt" id="ckDate">—</div>' +
        '<div class="world" id="ckWorld"></div>' +
      '</div>';

    const canvas = body.querySelector('#ckCanvas');
    const ctx = canvas.getContext('2d');
    const dig = body.querySelector('#ckDig');
    const dt = body.querySelector('#ckDate');
    const world = body.querySelector('#ckWorld');

    const zones = [
      { n: 'Hà Nội', tz: 'Asia/Ho_Chi_Minh' },
      { n: 'Tokyo', tz: 'Asia/Tokyo' },
      { n: 'London', tz: 'Europe/London' },
      { n: 'New York', tz: 'America/New_York' }
    ];

    function drawClock() {
      const d = new Date();
      const W = 220, C = W / 2, R = C - 10;

      ctx.clearRect(0, 0, W, W);
      ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--win2') || '#efefef';
      ctx.beginPath();
      ctx.arc(C, C, R, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(128,128,128,.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(C, C, R, 0, Math.PI * 2);
      ctx.stroke();

      /* Vạch chia */
      for (let i = 0; i < 60; i++) {
        const a = (i / 60) * Math.PI * 2 - Math.PI / 2;
        const inner = i % 5 === 0 ? R - 14 : R - 7;
        ctx.beginPath();
        ctx.moveTo(C + Math.cos(a) * inner, C + Math.sin(a) * inner);
        ctx.lineTo(C + Math.cos(a) * (R - 3), C + Math.sin(a) * (R - 3));
        ctx.strokeStyle = i % 5 === 0 ? '#0078d4' : 'rgba(128,128,128,.35)';
        ctx.lineWidth = i % 5 === 0 ? 2.5 : 1;
        ctx.stroke();
      }

      const acc = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#0078d4';
      const txtCol = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#1b1b1b';

      function hand(angle, len, width, color) {
        ctx.beginPath();
        ctx.moveTo(C, C);
        ctx.lineTo(C + Math.cos(angle) * len, C + Math.sin(angle) * len);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.stroke();
      }

      const h = d.getHours() % 12, m = d.getMinutes(), s = d.getSeconds();
      hand((h / 12 + m / 720) * Math.PI * 2 - Math.PI / 2, R * 0.5, 5, txtCol);
      hand((m / 60 + s / 3600) * Math.PI * 2 - Math.PI / 2, R * 0.72, 3.5, txtCol);
      hand((s / 60) * Math.PI * 2 - Math.PI / 2, R * 0.82, 1.8, acc);

      ctx.beginPath();
      ctx.arc(C, C, 5, 0, Math.PI * 2);
      ctx.fillStyle = acc;
      ctx.fill();

      dig.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      const days = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
      dt.textContent = days[d.getDay()] + ', ' + d.getDate() + ' tháng ' + (d.getMonth() + 1) + ', ' + d.getFullYear();

      world.innerHTML = '';
      zones.forEach(z => {
        let timeStr = '--:--';
        try {
          timeStr = new Intl.DateTimeFormat('vi-VN', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: z.tz }).format(d);
        } catch (e) {}
        const el = document.createElement('div');
        el.innerHTML = '<b>' + timeStr + '</b><span>' + z.n + '</span>';
        world.appendChild(el);
      });
    }

    drawClock();
    const t = setInterval(() => {
      if (!document.body.contains(body)) { clearInterval(t); return; }
      drawClock();
    }, 1000);
  }
};

/* ============================================================
   13. KHỞI TẠO
   ============================================================ */
function init() {
  applyTheme();
  applyWallpaper();
  renderDesktopIcons();
  renderStart();
  renderQuick();
  renderCalendar();
  renderTaskbar();

  /* Phím tắt toàn cục */
  document.addEventListener('keydown', (e) => {
    if ($('#lock').style.display === 'none' || $('#lock').classList.contains('hide')) {
      /* Meta / Windows key */
      if (e.key === 'Meta' || e.key === 'OS') {
        e.preventDefault();
        toggleStart();
      }
      if (e.key === 'Escape') {
        closeStart();
        closePanels();
        hideContextMenu();
      }
      /* Alt + F4 → đóng cửa sổ đang focus */
      if (e.altKey && e.key === 'F4' && state.activeId) {
        e.preventDefault();
        closeWin(state.activeId);
      }
    }
  });

  /* Cập nhật taskbar định kỳ (cho chỉ báo đang chạy) */
  setInterval(renderTaskbar, 1500);
}

window.addEventListener('load', init);

/* Re-render khi resize màn hình */
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    wins.forEach(w => {
      if (w.maximized || w.snapped) {
        const DW = desktopEl.clientWidth, DH = desktopEl.clientHeight;
        if (w.maximized) {
          w.el.style.width = DW + 'px';
          w.el.style.height = DH + 'px';
        }
      } else {
        /* Giữ cửa sổ trong màn hình */
        const l = parseFloat(w.el.style.left) || 0;
        const t = parseFloat(w.el.style.top) || 0;
        if (l > desktopEl.clientWidth - 100) w.el.style.left = Math.max(0, desktopEl.clientWidth - w.el.offsetWidth) + 'px';
        if (t > desktopEl.clientHeight - 60) w.el.style.top = Math.max(0, desktopEl.clientHeight - w.el.offsetHeight) + 'px';
      }
    });
  }, 120);
});
</script>
